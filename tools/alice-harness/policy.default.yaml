denyRead:
  - .env
  - .env.*
  - "*/.env"
  - "*/.env.*"
  - .git
  - ".git/*"
  - "*/.git/*"
  - "node_modules/*"
  - "*/node_modules/*"

protectedWrite:
  - "tools/alice-harness/*"
  - "tools/jorge/*"
  - "*.test.ts"
  - "*.spec.ts"
  - "*.test.tsx"
  - "*.spec.tsx"
  - "test/*"
  - "*/test/*"
  - "tests/*"
  - "*/tests/*"
  - "test_*.py"
  - "*/test_*.py"
  - "docs/*"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "package.json"
  - "*/package.json"
  - "pnpm-lock.yaml"
  - "tsconfig*"
  - "*/tsconfig*"
  - "eslint*"
  - "*/eslint*"
  - ".dependency-cruiser*"
  - "vitest*"
  - "*/vitest*"
  - "stryker*"
  - "*/stryker*"
  - ".github/*"
  - "*/migrations/*"
  - ".claude/*"

forbiddenAdded:
  - label: "suppression"
    pattern: "eslint-disable"
  - label: "suppression"
    pattern: "@ts-(ignore|expect-error|nocheck)"
  - label: "suppression"
    pattern: "#\\s*(noqa|type:\\s*ignore)"
  - label: "any"
    pattern: "(:\\s*any\\b|<any>|\\bas\\s+any\\b)"
  - label: "console"
    pattern: "\\bconsole\\."
  - label: "focused/skipped test"
    pattern: "\\b(it|describe|test)\\.(only|skip)\\b"
  - label: "TODO without id"
    pattern: "\\b(TODO|FIXME)\\b(?!\\s*\\(?[A-Z]+-[A-Z]?\\d+)"

