id: E-01
title: "Write docs/estudo/graficos.py: render the study charts as PNG from docs/estudo/dados.json"
kind: implement
readFirst: [docs/estudo/dados.json]
allowedPaths: [docs/estudo/graficos.py, docs/estudo/graficos/*.png]
checks:
  - python3 -m py_compile docs/estudo/graficos.py
  - python3 docs/estudo/graficos.py
  - test -s docs/estudo/graficos/01-toy-antes-depois.png
  - test -s docs/estudo/graficos/02-think.png
  - test -s docs/estudo/graficos/03-tarefas.png
  - test -s docs/estudo/graficos/04-divisao-tokens.png
done:
  - "Script uses matplotlib (Agg backend) + json + pathlib only; reads dados.json relative to the script file; writes PNGs to the graficos/ folder next to it; 1600x900 px (figsize 16x9, dpi 100)"
  - "Style for every chart: background #fcfcfb; text #0b0b0b (titles) and #52514e (labels); axis/tick color #898781; only a light horizontal or vertical gridline #e1e0d9 behind bars; no top/right spines; font size >= 14; title in pt-BR at top-left; one y/x value axis only (never two axes); thousands formatted pt-BR (1.000)"
  - "Colors: series 1 #2a78d6 (blue), series 2 #eb6834 (orange). Never use other colors except #898781 for neutral bars"
  - "01-toy-antes-depois.png: horizontal stacked bars, one per entry of toy[] (label = rotulo), segments entrada (blue) and saida (orange) with a 2px gap (white edge, linewidth 2); legend 'Entrada'/'Saída'; total value label at the end of each bar; title 'Mesma tarefa, três versões: tokens da Alice'"
  - "02-think.png: two side-by-side subplots (small multiples), left = saida tokens, right = segundos, bars per modo; single color blue; value label on top of each bar; title 'Raciocínio estendido ligado × desligado'"
  - "03-tarefas.png: horizontal bars of entrada tokens per task (label 'H-01 · o_que'), blue; at bar end write the value plus ' · N tentativa(s) · ✓' when status done or ' · ✗ (falso positivo)' when failed; title 'Tokens de entrada por tarefa (cresce com o histórico)'"
  - "04-divisao-tokens.png: horizontal bars: 'Claude (estimado)' = claude_estimado in orange, 'Alice · entrada' and 'Alice · saída' in blue; value labels; title 'Quem gastou os tokens na V1'"
  - "Under 150 lines; no other dependencies"
budget: {attempts: 4, toolCalls: 25}
refactor: false
