# Perfis de modelo do harness (ALICE_PROFILE=<nome>; padrão: gemma). Cada perfil leva os parâmetros que
# o fabricante recomenda e um num_ctx medido para caber na GPU (ver docs/estudo/bancada-modelos.md).
# O prompt de sistema é sempre o do harness: usar o modelo-base, não um wrapper com SYSTEM próprio.
profiles:
  gemma:  # linha de base: o que rodou até a E2b-1
    model: alice
    num_ctx: 32768
    temperature: 0.2
    think: false
  gptoss:  # gpt-oss:20b (MXFP4). OpenAI: temperature 1.0, top_p 1.0; raciocínio low/medium/high no campo think
    model: gpt-oss:20b
    timeScale: 4     # ~26 tok/s contra ~120 da gemma
    num_ctx: 32768   # 14,1 GB carregado, 9,6 GB na GPU; 26 tok/s de saída
    temperature: 1.0
    top_p: 1.0
    think: low
  qwen38:  # Qwen3.8-27B (densa) em 2 bits da Unsloth: o único Qwen 3.8 que cabe na GPU com 32k
    model: hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ2_XXS
    num_ctx: 32768   # 9,6 GB, 100% na GPU; 52 tok/s (q4_K_M 18 GB e q8 30 GB não cabem)
    timeScale: 3
    think: false
    temperature: 0.7  # recomendação Qwen para modo sem raciocínio
    top_p: 0.8
    top_k: 20
    min_p: 0
    presence_penalty: 0  # Qwen sugere até 1.5 contra repetição; em código isso penaliza repetir identificadores
  qwen35:  # qwen3.5:9b-q4_K_M: o Qwen mais novo com tag oficial que cabe (3.6/3.8 começam em 17 GB)
    model: qwen3.5:9b-q4_K_M
    num_ctx: 32768   # 6,5 GB, 100% na GPU; 82 tok/s
    timeScale: 2
    think: false
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0
    presence_penalty: 0
