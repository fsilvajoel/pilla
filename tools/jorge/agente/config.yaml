# Config do agente Jorge — editável pelo próprio Jorge (evolução registrada no relatório).
# O núcleo (tools/jorge/nucleo/nucleo.yaml) aplica os tetos e a lista de modelos permitidos;
# valor fora disso é ignorado e o padrão do núcleo vale.
api:
  model: gpt-6-sol          # permitidos: gpt-6-sol, gpt-6.1-sol, gpt-6-luna, gpt-6.1-terra, gpt-6-astra (5x o preço)

limites:
  passos_analise: 40        # chamadas ao modelo na análise
  passos_aplicacao: 60      # chamadas ao modelo na aplicação
  linhas_por_leitura: 400   # read_file por chamada
  linhas_busca: 150         # search_code / metricas
  linhas_saida_testes: 80   # cauda da suíte devolvida
  repeticao_aviso: 3
  repeticao_aborta: 5
  timeout_testes_s: 600
