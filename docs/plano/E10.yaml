    done:
      - 'activate (A1 to A3, C1 to C5): DRAFT becomes ACTIVE with disbursed_at and account_id; installments equal the @pilla/finance schedule of CA-01 (T-14); one LoanActivated in core.outbox in the same transaction'
      - 'refusals (A4 to A6, C6 to C10): unknown or inactive account 422 on accountId; firstDueDate not after disbursedAt 422 FIRST_DUE_DATE_BEFORE_DISBURSEMENT; non DRAFT 409 LOAN_NOT_EDITABLE; wrong If-Match 409 VERSION_CONFLICT; nothing is written on refusal'
      - 'origin (A7, A8, C11 to C13): activating a RENEWAL DRAFT sets the origin to RENEWED and writes LoanRenewed, without a disbursement flag; an origin that is no longer ACTIVE gives 409 LOAN_NOT_EDITABLE'
