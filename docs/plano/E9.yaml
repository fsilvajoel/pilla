delivery: E9
title: People registration end to end (API on NestJS + Postgres, shadcn screens); people only
# Plano e decisões D1–D10 em docs/plano/E9.md. Cartões esqueleto: o planner de cada feature detalha done, hints
# e readFirst no plano.md da feature antes do refinamento. Cartões em inglês (ADR-0012).
# Regra de dono: bia escreve testes; alice implementa backend (apps/api, packages/schemas); claude faz infra e web.
# Todo cartão que toca apps/web leva skills; cartão de tela leva também shadcn e tailwind-css (gate card-skills).
cards:
  # ---------------------------------------------------------------- E9-F01: banco de desenvolvimento
  - id: E9-T01
    title: Add the dev Postgres (docker compose), migrate and seed scripts
    kind: implement
    assignee: claude
    rules: [RN-P01, RN-P02]
    skills: [security-best-practices]
    refs: [RFC-003 §4.8, RFC-005 §3, RFC-005 §8, PRD-001 RF-01, PRD-001 RF-02, PRD-001 RF-03, docs/plano/E9.md D2 D3 D4, docs/plano/E9-F01/plano.md]
    dependsOn: []
    allowedPaths:
      - infra/docker-compose.yml
      - apps/api/scripts/migrate.mts
      - apps/api/scripts/seed.mts
      - apps/api/package.json
      - pnpm-lock.yaml
      - .env.example
      - docs/dev/banco-local.md
      - docs/travas.md
    protectedTests: []
    checks:
      - docker compose -f infra/docker-compose.yml up -d --wait
      - pnpm --filter @pilla/api db:migrate && pnpm --filter @pilla/api db:migrate
      - pnpm --filter @pilla/api db:seed && pnpm --filter @pilla/api db:seed
      - node scripts/check-env-example.mjs
      - node scripts/check-allowed-deps.mjs
    done:
      - Docker is installed on the dev environment (outside the repo) and the compose runs PostgreSQL 17 bound to 127.0.0.1 with the named volume pilla-pgdata and a healthcheck (A1, C1; P4)
      - docker compose config shows the published port as 127.0.0.1:${POSTGRES_PORT}:5432 and no port on 0.0.0.0; a POSTGRES_PORT that is not numeric or is above 65535 is refused (A1, C3; P4)
      - a missing POSTGRES_* variable makes docker compose fail naming the variable (A1, C2)
      - db:migrate applies the drizzle migrations of every folder of migrationFolders to DATABASE_URL and is idempotent: the second run exits 0 with no new row in drizzle.migrations_<folder> (A2, C4)
      - db:migrate with DATABASE_URL empty, blank or not a postgres:// URL exits 1 with a message in stderr and opens no connection (A2, C5)
      - db:seed inserts 6 fictional people (valid CPFs, E.164 phones, 8 addresses, 8 PIX keys, exactly one referral) in one transaction and is idempotent: the second run exits 0 with the same counts 6 / 8 / 8 (A3, C6, C7)
      - db:seed on a database without migrations exits 1 and leaves no row; a missing DATABASE_URL exits 1 (A3, C8)
      - db:seed refuses a DATABASE_URL whose host is not 127.0.0.1 or localhost (exit 1, clear message, no connection) (A3, C8; P3)
      - every new variable is in .env and .env.example in the same commit; no real secret in git (A4)
      - check-env-example.mjs exits 0 with the new keys and exits 1 listing a key that is in only one of the two files (A4, C9)
      - docs/dev/banco-local.md explains up, migrate, seed and reset in pt-BR with the exact commands, the .env.example variables and the 1024-65535 range of POSTGRES_PORT (A5, C10; P4)
      - pg and @types/pg are installed in apps/api/package.json with pnpm-lock.yaml updated and @types/pg in the Dev list of docs/travas.md, so check-allowed-deps.mjs exits 0 (P2)
    hints:
      - 'load the root .env with node --env-file=../../.env (the cwd of pnpm --filter is apps/api) and run with tsx, as in "db:migrate": "node --env-file=../../.env --import tsx scripts/migrate.mts"; .mts with extensionless relative imports needs tsx'
      - the migrator is drizzle-orm/node-postgres/migrator with migrationsFolder "migrations/<folder>", migrationsSchema "drizzle" and migrationsTable "migrations_<folder>"; reuse migrationFolders of src/db/migrate.ts so the order is not duplicated
      - 'seed: INSERT ... ON CONFLICT DO NOTHING by id, one transaction, people before addresses and PIX, the referred person after the referrer (FK persons_referred_by_id_fkey); optional fields left out, never undefined (lesson of E5-F02)'
      - no any; close the pg Pool in finally; never log DATABASE_URL or the password
      - 'compose: ${VAR:?message} on the required variables, the fixed tag postgres:17 (P4), the named volume pilla-pgdata and a healthcheck for up -d --wait'
      - 'seed data: Ana Souza 12345678909, Bruno Lima 11144477735 (referred by Ana), Carla Dias 10020030088, Diego Rocha 21436587107, Elisa Prado 31415926590, Fábio Nunes 27182818205; phones +5511999990001 to +5511999990006; fixed literal uuid ids chosen by the implementer; 8 addresses and 8 PIX keys, at least 1 of each per person and exactly 1 primary per person (a person with only one is primary)'
      - the host refusal (P3) reads the host of DATABASE_URL, accepts only 127.0.0.1 and localhost and exits 1 with a message in stderr before opening a connection
      - the 1024-65535 range of POSTGRES_PORT (P4) goes in the comment of .env.example and in docs/dev/banco-local.md; the refusal of a non numeric value or of a value above 65535 comes from compose or Postgres (C3)
      - '@types/pg goes in devDependencies of apps/api/package.json and in the Dev list of docs/travas.md, otherwise node scripts/check-allowed-deps.mjs fails (P2, travas §7)'
    budget: {attempts: 3, toolCalls: 40, minutes: 30}
    readFirst:
      - docs/plano/E9-F01/plano.md
      - docs/plano/E9.md
      - docs/rfc/RFC-003-stack-tecnologica.md
      - docs/rfc/RFC-005-modelo-fisico-banco.md
      - apps/api/src/db/migrate.ts
      - apps/api/src/people/infra/schema.ts
      - apps/api/migrations/people
      - .env.example
      - scripts/check-env-example.mjs
      - docs/travas.md
      - docs/memoria/README.md
    sizeNote: compose ~25 linhas, dois scripts curtos, doc curta

