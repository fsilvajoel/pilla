delivery: E9
title: People registration end to end (API on NestJS + Postgres, shadcn screens); people only
# Plano e decisões D1–D10 em docs/plano/E9.md. Cartões esqueleto: o planner de cada feature detalha done, hints
# e readFirst no plano.md da feature antes do refinamento. Cartões em inglês (ADR-0012).
# Regra de dono: bia escreve testes; alice implementa backend (apps/api, packages/schemas); claude faz infra e web.
# Todo cartão que toca apps/web leva skills; cartão de tela leva também shadcn e tailwind-css (gate card-skills).
cards:
  # ---------------------------------------------------------------- E9-F01: banco de desenvolvimento
  - id: E9-T01
    title: Add the dev Postgres (docker compose), migrate and seed scripts
    kind: implement
    assignee: claude
    rules: []
    skills: [editar-arquivo, security-best-practices]
    refs: [RFC-003 §4.8, docs/plano/E9.md D2]
    dependsOn: []
    allowedPaths:
      - infra/docker-compose.yml
      - apps/api/scripts/migrate.mts
      - apps/api/scripts/seed.mts
      - apps/api/package.json
      - .env.example
      - docs/dev/banco-local.md
    protectedTests: []
    checks:
      - docker compose -f infra/docker-compose.yml up -d --wait
      - pnpm --filter @pilla/api db:migrate
      - pnpm --filter @pilla/api db:seed
      - node scripts/check-env-example.mjs
    done:
      - Docker is installed on the dev environment (outside the repo) and the compose runs PostgreSQL bound to 127.0.0.1 with a named volume
      - db:migrate applies the drizzle migrations to DATABASE_URL and is idempotent
      - db:seed inserts 5 to 10 fictional people (valid CPFs, addresses, PIX keys, one referral) and is idempotent
      - every new variable is in .env and .env.example in the same commit; no real secret in git
      - docs/dev/banco-local.md explains up, migrate, seed and reset in pt-BR
    budget: {attempts: 3, toolCalls: 40, minutes: 30}
    sizeNote: compose ~25 linhas, dois scripts curtos, doc curta

  # ---------------------------------------------------------------- E9-F02: base da API NestJS
  - id: E9-T02
    title: Write the tests for the API bootstrap, health, Zod pipe and problem+json filter
    kind: test-author
    assignee: bia
    rules: []
    skills: [escrever-teste]
    refs: [RFC-003 §4.2, RFC-004 §2, RFC-004 §6, docs/plano/E9.md D1]
    dependsOn: [E9-T01]
    allowedPaths:
      - apps/api/src/core/http/*.test.ts
      - apps/api/src/app.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/core/http src/app.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/core/http apps/api/src/app.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - GET /api/v1/health answers 200 with the database status
      - a body that fails the Zod schema answers 400 application/problem+json with code VALIDATION_FAILED and the field errors
      - an unknown route answers 404 problem+json NOT_FOUND; an unexpected error answers 500 problem+json without stack
    budget: {attempts: 4, toolCalls: 25, minutes: 15}
  - id: E9-T03
    title: Bootstrap the NestJS app with the database provider, Zod pipe and problem+json filter
    kind: implement
    assignee: alice
    rules: []
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [RFC-003 §4.2, RFC-004 §2, ADR-0002, docs/plano/E9.md D1 D3]
    dependsOn: [E9-T02]
    allowedPaths:
      - apps/api/src/main.ts
      - apps/api/src/app.module.ts
      - apps/api/src/core/http/**
      - apps/api/src/db/**
      - apps/api/package.json
    protectedTests: [apps/api/src/core/http/*.test.ts, apps/api/src/app.test.ts]
    checks:
      - pnpm --filter @pilla/api exec vitest run src/core/http src/app.test.ts
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - node scripts/check-allowed-deps.mjs
    done:
      - the T02 tests pass; the app listens on 127.0.0.1:PILLA_API_PORT with prefix /api/v1
      - the database provider reads DATABASE_URL from the environment; tests inject PGlite
      - Zod only at the HTTP edge, strong typing, no any
    budget: {attempts: 3, toolCalls: 40, minutes: 30}

