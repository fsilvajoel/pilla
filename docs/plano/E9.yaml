      - node scripts/check-test-quality.mjs packages/schemas/src/api/people/people.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'POST creates exactly 201 with Location and PersonResponse (A1/C1), rejects invalid or masked CPF/phone and strict unknown fields with 400 VALIDATION_FAILED and the field list (A2/C2), rejects duplicate CPF with 409 DUPLICATE_CPF (A3/C3), and maps an unknown referrer to 404 NOT_FOUND (A4/C4)'
      - 'GET list returns 200 with exact PersonListResponse for active-only and empty cases (A5/C5), ignores case and accents in name search, matches CPF by digit prefix, unions only-digit search and keeps mixed letter+digit as name-only (A6/C6)'
      - 'GET list paginates with opaque cursor and limit 1-100/default 20 (A7/C7); limit 0, -1, 101, 1.5, 1e1, empty or abc and malformed cursor give 400 VALIDATION_FAILED at limit or cursor'
      - 'GET by id returns the exact basic PersonResponse and omits the aggregate fields (A8/C8); an unknown UUID returns 404 NOT_FOUND'
      - 'PATCH accepts only the documented partial fields plus version, clears email/birthDate/notes with null, rejects cpf null and unknown fields with 400, increments version to 4 and omits cleared optional fields (A9/C9)'
      - 'PATCH uses version in the body and not If-Match/ETag/428: stale version gives 409 VERSION_CONFLICT and missing version gives 400 VALIDATION_FAILED (A10/C10)'
      - 'PATCH duplicate CPF gives 409 DUPLICATE_CPF and leaves CPF and version unchanged (A11/C11)'
    budget: {attempts: 4, toolCalls: 30, minutes: 20}
