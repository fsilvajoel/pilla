  - id: E9-T05
    title: Write the tests for the people routes (POST, GET list/search, GET by id, PATCH)
    kind: test-author
    assignee: bia
    rules: []
    skills: [escrever-teste]
    refs: [RFC-004 §3, RFC-004 §6, PRD-001 RF-01, PRD-001 RF-03, docs/plano/E9.md D8 D9]
    dependsOn: [E9-T04, E5-F02, E5-F05]
    allowedPaths:
      - apps/api/src/people/http/*.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/people/http'
      - node scripts/check-test-quality.mjs apps/api/src/people/http
      - pnpm --filter @pilla/api typecheck
    done:
      - POST creates (201 + Location), invalid CPF gives 400, repeated CPF gives 409 DUPLICATE_CPF, unknown referrer gives 400
      - GET list searches by name or CPF (listPersons rule, E5-F05 A11/A16 - name by case-insensitive substring, CPF by digit prefix ignoring dot and dash, union when the search is only digits; mixed letter+digit search is name substring only, never a CPF prefix), paginates by cursor and respects limit (default 20, max 100, above gives 400)
      - POST and PATCH bodies are validated by the schema, not by the web - CPF with check digits, phone and PIX key format; masked CPF or phone input (dots, dash, parentheses) is normalized to digits; errors give 400 with the field list
      - GET by id gives 200 or 404 NOT_FOUND
      - PATCH without If-Match gives 428, stale version gives 409 VERSION_CONFLICT, success returns the new version in ETag
    budget: {attempts: 4, toolCalls: 30, minutes: 20}
