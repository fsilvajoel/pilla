- id: E2-T11
  title: Pre-review the event schemas against RFC-004 §7
  kind: pre-review
  assignee: alice
  rules: []
  refs:
  - RFC-004 §7
  dependsOn:
  - E2-T02
  - E2-T03
  - E2-T04
  - E2-T05
  - E2-T06
  - E2-T07
  - E2-T08
  - E2-T09
  - E2-T10
  - E2-T12
  allowedPaths: []
  protectedTests: []
  checks:
  - pnpm --filter @pilla/schemas test
  - node scripts/check-avoid.mjs docs/memoria/libs/zod.md packages/schemas/src
  - node scripts/check-schemas.mjs packages/schemas/src
  done:
  - 'one line per checklist item: ''<key> ok|falta|parcial|n/a - evidence (file:line or command)'''
  budget:
    attempts: 3
    toolCalls: 30
    minutes: 8
  checklist:
  - C1 every event of RFC-004 §7 has a schema file and a test block named with the event type
  - C2 every payload is z.strictObject (no personal data, no unknown fields)
  - C3 money, rate and id fields use the primitives of common.ts; run_check 2 (rule S3) proves it
  - C4 business dates use isoDateSchema; only occurredAt is an instant
  - C5 no regex outside common.ts; run_check 2 (rule S2) proves it
  - C6 every schema is exported from src/index.ts; run_check 2 (rule S1) proves it
  - C7 field names match docs/glossario.md and RFC-004 §7 exactly
  - C8 every zod API used exists and follows the zod sheet (docs/memoria/libs/zod.md); run_check 1 lists what the sheet says to avoid
- id: E2-T12
  title: Draft the zod 4 cheat sheet from the official docs
  kind: docs
  assignee: alice
  rules: []
  refs:
  - https://zod.dev/api
  dependsOn:
  - E2-T01
  allowedPaths:
  - docs/memoria/libs/zod.md
  protectedTests: []
  checks:
  - node scripts/check-lib-sheet.mjs docs/memoria/libs/zod.md packages/schemas zod z zod.dev 400
  done:
  - '<= 400 words in pt-BR, sections: Use (the right zod 4 call, one code line each), Evite (zod 3 habit -> zod 4 call), Fonte'
  - 'cover what this repo uses: z.strictObject, z.int, z.uuidv7, z.iso.date, z.iso.datetime({offset}), z.literal, .refine, z.infer'
  - every API comes from fetch_page of zod.dev (cite the URL); never from memory
  - the check runs each z.* call against the installed zod and lists the ones that do not exist
  readFirst:
  - packages/schemas/src/common.ts
  - packages/schemas/src/events/payment-confirmed.ts
  budget:
    attempts: 3
    toolCalls: 20
    minutes: 8
