- id: E2-T11
  title: Pre-review the event schemas against RFC-004 §7
  kind: pre-review
  assignee: alice
  rules: []
  refs:
  - RFC-004 §7
  dependsOn:
  - E2-T02
  - E2-T03
  - E2-T04
  - E2-T05
  - E2-T06
  - E2-T07
  - E2-T08
  - E2-T09
  - E2-T10
  allowedPaths: []
  protectedTests: []
  checks:
  - pnpm --filter @pilla/schemas test
  done:
  - 'one line per checklist item: ''<key> ok|falta|parcial|n/a - evidence (file:line or command)'''
  budget:
    attempts: 3
    toolCalls: 30
    minutes: 8
  checklist:
  - C1 every event of RFC-004 §7 has a schema file and a test block named with the event type
  - C2 every payload is z.strictObject (no personal data, no unknown fields)
  - C3 money fields end in Cents and use centsSchema or positiveCentsSchema
  - C4 business dates use isoDateSchema; only occurredAt is an instant
  - C5 no regex or z.string() for ids, dates or money outside common.ts
  - C6 every schema is exported from src/index.ts
  - C7 field names match docs/glossario.md and RFC-004 §7 exactly
