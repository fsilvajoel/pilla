# Gerado por script do Claude a partir da RFC-004 §7. Módulo-modelo: E2-T01 (Claude). Ver docs/plano/README.md.
delivery: E2
title: Event contracts in packages/schemas (RFC-004 §7) from a model module
cards:
- id: E2-T01
  title: 'Model module: wire primitives, event envelope and PaymentConfirmed v1 plus tests for all events'
  kind: implement
  assignee: claude
  rules: []
  refs:
  - RFC-004 §2
  - RFC-004 §7
  - RFC-005 §1
  dependsOn:
  - E1-T20
  allowedPaths:
  - packages/schemas/**
  protectedTests: []
  checks:
  - pnpm --filter @pilla/schemas exec vitest run src/events/events.test.ts -t PaymentConfirmed
  - pnpm --filter @pilla/schemas typecheck
  - pnpm --filter @pilla/schemas lint
  done:
  - common.ts with the wire primitives (uuid v7, cents, bps, date, instant, reason)
  - eventV1 envelope (strict, version 1)
  - 'payment-confirmed.ts as the model: strictObject payload, allocations sum to amountCents'
  - table-driven events.test.ts for the 10 events of RFC-004 §7; one z.never() stub per remaining event
  budget:
    attempts: 5
    toolCalls: 30
- id: E2-T02
  title: Implement the LoanActivated v1 event schema
  kind: implement
  assignee: alice
  rules: []
  refs:
  - RFC-004 §7
  dependsOn:
  - E2-T01
  allowedPaths:
  - packages/schemas/src/events/loan-activated.ts
  protectedTests:
  - packages/schemas/src/events/events.test.ts
  checks:
  - pnpm --filter @pilla/schemas exec vitest run src/events/events.test.ts -t LoanActivated
  - pnpm --filter @pilla/schemas typecheck
  - pnpm --filter @pilla/schemas lint
  done:
  - all LoanActivated tests in events.test.ts pass (vitest -t filter)
  - 'payload fields: loanId, personId, accountId (uuid v7), principalCents (>= 0), disbursedAt (date); optional originLoanId (uuid v7) and originType (RENEWAL | RENEGOTIATION | IMPORT, RFC-005 §4)'
  - replace only the z.never() payload; z.strictObject like payment-confirmed.ts
  - reuse the primitives of ../common (idSchema, centsSchema, isoDateSchema, reasonSchema); never write a new regex
  - one edit_file call; the file stays under 25 lines
  budget:
    attempts: 4
    toolCalls: 20
    minutes: 6
  readFirst:
  - packages/schemas/src/events/payment-confirmed.ts
  - packages/schemas/src/common.ts
  - packages/schemas/src/events/loan-activated.ts
  sizeNote: um evento por cartão; o modelo é payment-confirmed.ts
