delivery: E3
title: Database tables in apps/api (RFC-005), one table per card, from the core model module
cards:
  - id: E3-T00
    title: Model module for the database (apps/api, Drizzle, PGlite tests, core.outbox)
    kind: implement
    assignee: claude
    rules: []
    refs: [RFC-005 §1, RFC-005 §2, RFC-005 §8, RFC-003 §4.1]
    dependsOn: []
    allowedPaths: [apps/api/**]
    checks:
      - pnpm --filter @pilla/api test
    done:
      - core.outbox and core.processed_events migrated and tested; conventions.test.ts checks RFC-005 §1 on the migrated database
  - id: E3-T01
    title: Add the core.audit_log table (RFC-005 §2)
    kind: implement
    assignee: alice
    rules: []
    refs: [RFC-005 §2, RFC-005 §1]
    dependsOn: [E3-T00]
    allowedPaths:
      - apps/api/src/core/infra/schema.ts
    generatedPaths:
      - apps/api/migrations/core/*
    protectedTests:
      - apps/api/src/core/infra/audit-log.test.ts
      - apps/api/src/db/conventions.test.ts
    checks:
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api db:regen audit_log
      - pnpm --filter @pilla/api exec vitest run src/core/infra/audit-log.test.ts src/db/conventions.test.ts
      - pnpm --filter @pilla/api lint
    done:
      - run_check 1 writes the migration (0001_audit_log.sql and meta/); run it again after every change to schema.ts; never write the migration by hand
      - all tests in audit-log.test.ts and apps/api/src/db/conventions.test.ts pass (run_check 2)
      - "columns: id uuid PK; actor_type text; actor_id uuid (sem .notNull()); action text; entity_type text; entity_id uuid; before/after jsonb e ip inet (sem .notNull()); at timestamptz"
      - every column without "null" above is notNull()
      - actor_type is text with a CHECK constraint, not a PostgreSQL enum (RFC-005 §1)
      - index on (entity_type, entity_id, at)
      - add the table after processedEvents in schema.ts; keep outbox and processedEvents unchanged
      - export type AuditLogRow = typeof auditLog.$inferSelect;
    hints:
      - "import check and inet from drizzle-orm/pg-core; CHECK: check(\"audit_log_actor_type_check\", sql`${t.actorType} IN ('ADMIN', 'CLIENT', 'SYSTEM')`)"
      - "the instant() helper of schema.ts gives timestamptz; the index goes in the table's second argument, like outbox_pending_idx"
      - one edit_file call appending the table at the end of schema.ts, then run_check 0 (typecheck), 1 (migration) and 2 (tests)
    budget:
      attempts: 4
      toolCalls: 25
      minutes: 8
    readFirst:
      - apps/api/src/core/infra/schema.ts
      - apps/api/src/core/infra/audit-log.test.ts
    sizeNote: uma tabela por cartão; o modelo é outbox em core/infra/schema.ts
  - id: E3-T02
    title: core.attachments table (Drizzle schema + generated migration)
    assignee: alice
    kind: implement
    rules: []
    refs: [RFC-005 §2, RFC-005 §1]
    dependsOn: [E3-T01]
    allowedPaths:
      - apps/api/src/core/infra/schema.ts
    generatedPaths:
      - apps/api/migrations/core/*
    protectedTests:
      - apps/api/src/core/infra/attachments.test.ts
      - apps/api/src/db/conventions.test.ts
    checks:
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api db:regen attachments
      - pnpm --filter @pilla/api exec vitest run src/core/infra/attachments.test.ts src/db/conventions.test.ts
      - pnpm --filter @pilla/api lint
    done:
      - run_check 1 writes the migration (0002_attachments.sql and meta/); run it again after every change to schema.ts; never write the migration by hand
      - all tests in attachments.test.ts and apps/api/src/db/conventions.test.ts pass (run_check 2)
      - "every column has .notNull(); id: uuid(\"id\").primaryKey(); kind: text(\"kind\"); fileName: text(\"file_name\")"
      - "contentType: text(\"content_type\"); sizeBytes: bigint(\"size_bytes\", { mode: \"number\" }); sha256: char(\"sha256\", { length: 64 })"
      - "storageKey: text(\"storage_key\").notNull().unique(); uploadedBy: uuid(\"uploaded_by\"); uploadedAt: instant(\"uploaded_at\")"
      - "check attachments_kind_check: kind IN ('RECEIPT', 'SIGNED_CONTRACT', 'IMPORT_FILE', 'OTHER')"
      - "check attachments_size_bytes_check: size_bytes >= 0; check attachments_sha256_check: sha256 ~ '^[0-9a-f]{64}$'"
      - add the table after auditLog in schema.ts; keep the other tables unchanged
      - export type AttachmentRow = typeof attachments.$inferSelect;
    hints:
      - "import bigint and char from drizzle-orm/pg-core (check is already imported)"
      - "each check is a call, like the one in auditLog: check(\"attachments_size_bytes_check\", sql`${t.sizeBytes} >= 0`)"
      - one edit_file call appending the table at the end of schema.ts, then run_check 0 (typecheck), 1 (migration) and 2 (tests)
    budget:
      attempts: 4
      toolCalls: 25
      minutes: 8
    readFirst:
      - apps/api/src/core/infra/schema.ts
      - apps/api/src/core/infra/attachments.test.ts
    sizeNote: uma tabela por cartão; o modelo é auditLog em core/infra/schema.ts
