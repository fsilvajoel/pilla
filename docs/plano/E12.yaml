      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A14)
      - core/infra/outbox-dispatcher.ts and outbox-poller.ts do not import treasury, lending or payments; consumers arrive through the OUTBOX_CONSUMERS token bound in app.module.ts to treasuryOutboxConsumers
