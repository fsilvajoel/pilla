cards:
  # ---------------------------------------------------------------- E12-F01: despachante do outbox e ledger por eventos
  - id: E12-T01
    title: Write the tests for the outbox dispatcher, the poller and the treasury ledger consumer
    kind: test-author
    assignee: claude
    rules: [RN-T01, RN-T02, RN-T03]
    skills: [escrever-teste]
    refs: [PRD-001 RN-T02, PRD-001 RN-T03, RFC-004 §7, RFC-005 §2, RFC-005 §6, ADR-0003, ADR-0004, ADR-0006, docs/plano/E10.md D6 D7, docs/plano/E12.md D1 D2 D3 D8, docs/plano/E12-F01/plano.md]
    dependsOn: [E11-T08]
    allowedPaths:
      - apps/api/src/core/infra/outbox-dispatcher.test.ts
      - apps/api/src/treasury/application/ledger-consumer.test.ts
      - apps/api/src/treasury/http/ledger-from-events.http.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/core/infra/outbox-dispatcher.test.ts src/treasury/application/ledger-consumer.test.ts src/treasury/http/ledger-from-events.http.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/core/infra/outbox-dispatcher.test.ts apps/api/src/treasury/application/ledger-consumer.test.ts apps/api/src/treasury/http/ledger-from-events.http.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'dispatcher (A9 to A12, C1 to C10): unpublished rows with attempts below 5 are read oldest first, at most 100 per round; an event with no interested consumer is marked published; processed_events prevents a second handle on redelivery; a throwing consumer rolls the whole event back (no ledger row, no processed_events row), adds 1 to attempts, stores last_error and the rest of the batch is still published; after 5 failures the event is no longer read'
      - 'poller (A13, C11, C12): with a fake clock it calls the dispatcher every interval, never starts a round while one is running and stops on application shutdown'
      - 'disbursement (A1 to A3, C13 to C15): LoanActivated without originType or with IMPORT writes one DISBURSEMENT PRINCIPAL of -principalCents, source LOAN loanId, entry_date disbursedAt, created_by SYSTEM_ACTOR_ID, source_event_id the event id; RENEWAL and RENEGOTIATION write nothing and the event is published'
      - 'repayment (A4, A5, C16 to C18): PaymentConfirmed writes one REPAYMENT per non-zero component (LATE_CHARGES, INTEREST, PRINCIPAL) whose sum is amountCents; with isRecovery it writes a single REPAYMENT RECOVERY of amountCents'
      - 'reversal (A6, A7, C19, C20): PaymentReversed writes one REVERSAL per REPAYMENT of the payment, same component and opposite amount, dated today in Brasília, so the payment rows sum to zero; with no REPAYMENT yet it fails, writes nothing, and a later round writes the REVERSAL'
      - 'ignored and invalid (A8, A10, C21, C22): LoanWrittenOff, LoanPaidOff, LoanReopened, InstallmentPaid and an unknown type write nothing and are published; a payload that fails the event schema fails only that event'
      - 'real flow (A14, C23, C24): activate a loan and confirm a payment through the API, run dispatchOutbox, and the account balance is -principal + paid; reverse and run again and it is -principal'
    budget: {attempts: 4, toolCalls: 30, minutes: 20}
    readFirst:
      - docs/plano/E12-F01/plano.md
      - apps/api/src/core/infra/outbox-writer.ts
      - apps/api/src/core/infra/schema.ts
      - apps/api/src/treasury/infra/schema.ts
      - apps/api/src/treasury/infra/ledger-entries.test.ts
      - packages/schemas/src/events/loan-activated.ts
      - packages/schemas/src/events/payment-confirmed.ts
      - packages/schemas/src/events/payment-reversed.ts
      - apps/api/src/payments/http/payments-reverse.http.test.ts
      - apps/api/src/core/http/test-app.ts
      - apps/api/src/db/test-db.ts
