    rules: [RN-T01, RN-T02, RN-T03]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RN-T02, PRD-001 RN-T03, RFC-001 M2, RFC-004 §7, RFC-005 §6, ADR-0003, ADR-0006, docs/plano/E12.md D1 D2 D3 D8, docs/plano/E12-F01/plano.md]
