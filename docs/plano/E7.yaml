      - one write_file per test file, then run_check 0, 1, 2, 3, 4 and 5
      - todayInBrt takes a Date and gives IsoDate of @pilla/finance, a branded string, so compare it with toBe against the plain text
      - PersonForm props are people, a readonly array of PersonSummary, and onSubmit, an optional callback that gets one CreatePersonRequest
