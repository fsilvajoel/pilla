delivery: E15
title: Customer portal (CPF-only read access, session, limits, loan views, admin switch)
# Plano e decisões D1-D15 em docs/plano/E15.md; escopo e critérios de cada feature em docs/plano/E15-F0x/plano.md.
# Cartões em inglês (ADR-0012). Dono recomendado: ver "Divisão entre trabalhadores" em E15.md.
# assignee segue o harness (claude); o modelo recomendado vai em `model` (opus só em segurança/difícil, sonnet médio, haiku simples).
# Todo cartão que toca apps/web leva skills; cartão de tela leva também shadcn e tailwind-css (gate card-skills).
# Depende da E14 (login do ADMIN) só: E15-T05, E15-T06, E15-T11, E15-T13. O resto roda sem a E14.
