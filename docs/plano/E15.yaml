# Dúvidas de produto com padrão assumido: docs/plano/pendencias-pm.md (E15-T03, E15-T05, E15-T07, E15-T09).
cards:
  # ---------------------------------------------------------------- E15-F01: contratos Zod
  - id: E15-T01
    title: Write the schema tests for the portal session, portal loans and portal access contracts
    kind: test-author
    assignee: claude
    model: haiku
    rules: [RN-A02, RN-A04]
    skills: [escrever-teste]
    refs: [PRD-001 RF-61, PRD-001 RF-62, PRD-001 RF-63, ADR-0004, ADR-0007, RFC-004 §4, RFC-004 §5, docs/plano/E15.md D2 D10, docs/plano/E15-F01/plano.md]
    dependsOn: []
    allowedPaths:
      - packages/schemas/src/api/access/portal-session.test.ts
      - packages/schemas/src/api/access/portal-loans.test.ts
      - packages/schemas/src/api/access/portal-access.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/schemas exec vitest run src/api/access'
      - node scripts/check-test-quality.mjs packages/schemas/src/api/access/portal-session.test.ts packages/schemas/src/api/access/portal-loans.test.ts packages/schemas/src/api/access/portal-access.test.ts
      - pnpm --filter @pilla/schemas typecheck
    done:
      - 'session (A1): createPortalSessionRequest accepts an 11-digit valid CPF and rejects punctuation, 10 or 12 digits, a wrong check digit, 11111111111, empty, a number and an extra key'
      - 'portal loans (A2, A4): the detail accepts the RFC-004 §5 example completed with id, situation, lateChargesCents, per-installment paidCents and lateChargesCents, accepts nextInstallment null, rejects a decimal or negative cents value and an unknown situation or method; the list accepts an empty items array'
      - 'no leak (A3): it.each over personId, personName, cpf, internalNotes, monthlyInterestRateBps, lateFeeBps, accountId, paymentId, pixEndToEndId, receipt, originType: each extra key is rejected at the top level of the detail and the list item, inside an installment and inside a payment'
      - 'access (A5): setPortalAccessRequest accepts {enabled: true|false} and rejects a string, a missing key and an extra key; portalAccessResponse accepts enabledAt null and an instant'
    budget: {attempts: 4, toolCalls: 25, minutes: 15}
    readFirst:
      - docs/plano/E15-F01/plano.md
      - packages/schemas/src/common.ts
      - packages/schemas/src/api/lending/loan-views.ts
      - packages/schemas/src/api/lending/dashboard-today.ts
      - packages/schemas/src/index.ts
  - id: E15-T02
    title: Implement the portal session, portal loans and portal access schemas
    kind: implement
    assignee: claude
    model: haiku
    rules: [RN-A02, RN-A04]
    skills: [editar-arquivo, coding-guidelines]
    refs: [PRD-001 RF-61, PRD-001 RF-62, PRD-001 RF-63, ADR-0004, RFC-004 §4, docs/plano/E15.md D2, docs/plano/E15-F01/plano.md]
    dependsOn: [E15-T01]
