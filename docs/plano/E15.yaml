      - 'the upsert, the audit insert and the session delete run in one transaction; version goes up only on a real change'
      - 'PERSON_WITHOUT_CPF has its pt-BR message in the messages file and its row in RFC-004 §6 (only if the PM answer of E15-T05 approved it)'
