      - pnpm --filter @pilla/web lint
    done:
      - 'portal-texts.ts holds every portal text, exactly the table in E15-F05A/plano.md; no text outside it; the only acronym is CPF'
      - '/portal shows the CPF form (label, help, autocomplete off, pasted dots and dash are stripped before sending); a Server Action calls POST /portal/session and writes the pilla_portal cookie (httpOnly, secure outside dev, sameSite lax, path /api/v1/portal or the proxy equivalent) from the API Set-Cookie; 401, 429 and other errors show the texts of the table; the CPF is never in the URL or in an error'
      - '/portal/contratos lists one card per loan with situation (text and colour), amounts in reais and the next installment; empty list shows the empty text; "Ver detalhes" links to /portal/contratos/{id}; a 401 goes back to /portal with the expired-session text'
      - '"Sair" calls DELETE /portal/session, clears the cookie and returns to /portal; the layout has no ADMIN navigation; pages are force-dynamic with cache no-store'
      - 'visual review in the browser at 360 px and desktop: entry, each error, list with current, overdue, paid off and empty; no console error'
    budget: {attempts: 3, toolCalls: 50, minutes: 40}
    readFirst:
      - docs/plano/E15-F05A/plano.md
      - apps/web/lib/api/client.ts
      - apps/web/lib/api/loans.ts
      - apps/web/lib/labels.ts
      - apps/web/app/(admin)/layout.tsx
      - apps/web/app/layout.tsx
