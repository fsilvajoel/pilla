  # ---------------------------------------------------------------- E15-F02: sessão do portal
  - id: E15-T03
    title: Write the tests for the portal session, the IP rate limit, the CPF hash and the portal guard
    kind: test-author
    assignee: claude
    model: opus
    rules: [RN-A02, RN-A04]
    skills: [escrever-teste]
    refs: [PRD-001 RN-A04, PRD-001 CA-09b, ADR-0007, ADR-0011, RFC-004 §4, RFC-004 §6, RFC-005 §7, docs/legal/pontos-legais.md L-08, docs/plano/E15.md D1 D3 D4 D5 D6 D7, docs/plano/E15-F02/plano.md]
    dependsOn: [E15-T02]
    allowedPaths:
      - apps/api/src/access/application/portal-rate-limit.test.ts
      - apps/api/src/access/http/portal-session.http.test.ts
      - apps/api/src/access/http/portal-guard.http.test.ts
      - apps/api/src/core/http/env.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/access/application/portal-rate-limit.test.ts src/access/http/portal-session.http.test.ts src/access/http/portal-guard.http.test.ts src/core/http/env.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/access/application/portal-rate-limit.test.ts apps/api/src/access/http/portal-session.http.test.ts apps/api/src/access/http/portal-guard.http.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'entry (A1, C7 to C9): an enabled person gets 204 and a pilla_portal cookie with HttpOnly, Secure, SameSite=Lax and Path=/api/v1/portal; sessions.id is the SHA-256 of the token and the token is not in the database; role CLIENT, person_id, ip, expires_at = now + 2 h; one OK row in access_logs; Cache-Control no-store'
      - 'generic answer (A2, C10): an unknown CPF, a person with no portal_access row and a disabled person return the same status, body and headers (401 UNAUTHENTICATED, fixed detail) and no Set-Cookie; the log rows are NOT_FOUND, NOT_FOUND and DISABLED; the same queries run in the same order in all three cases'
      - 'hash (A3, C11): cpf_hash is the HMAC-SHA256 of the CPF with the configured key; the CPF in plain text is in no table, response or captured log line; another key gives another hash'
      - 'rate limit (A4, A5, A6, C1 to C6): 30 attempts from one IP in 60 s pass, the 31st gets 429 TOO_MANY_REQUESTS with Retry-After and a RATE_LIMITED row and does not look up the person; another IP is not affected; with an injected clock the IP enters again once the window empties; RATE_LIMITED rows do not count; 40 parallel attempts let at most 30 through; a malformed CPF is 400, counts in the window and does not look up the person'
      - 'guard (A7 to A9, A11, C15 to C21): no cookie, a junk cookie, a deleted session, an inactive session (30 min) and an expired session (2 h) are 401; a valid session hands over personId and renews last_seen_at but never past expires_at; disabling portal_access after login makes the next call 401; an ADMIN session does not pass the portal guard; a new login deletes the same person''s expired sessions and keeps the valid ones'
      - 'logout (A10, C14): DELETE removes the session row, sends an expired cookie and answers 204 also without a cookie'
      - 'env (A12, C22, C23): readApiEnv fails without PILLA_ACCESS_HASH_KEY and with fewer than 32 characters; the message does not contain the value'
    budget: {attempts: 4, toolCalls: 40, minutes: 30}
    readFirst:
      - docs/plano/E15-F02/plano.md
      - apps/api/src/access/infra/schema.ts
      - apps/api/src/access/infra/sessions.test.ts
      - apps/api/src/access/infra/access-logs.test.ts
      - apps/api/src/access/infra/portal-access.test.ts
      - apps/api/src/core/http/test-app.ts
      - apps/api/src/core/http/env.test.ts
      - apps/api/src/core/http/problem-details.filter.ts
      - apps/api/src/db/test-db.ts
      - packages/schemas/src/api/access/portal-session.ts
  - id: E15-T04
    title: Implement the portal session service, the rate limit, the cookie and the portal guard
    kind: implement
    assignee: claude
    model: opus
    rules: [RN-A02, RN-A04]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RN-A04, ADR-0007, ADR-0011, RFC-004 §4, RFC-005 §7, docs/plano/E15.md D1 D3 D4 D5 D6 D7, docs/plano/E15-F02/plano.md]
    dependsOn: [E15-T03]
    allowedPaths:
      - apps/api/src/access/application/**
      - apps/api/src/access/http/**
      - apps/api/src/access/public/**
      - apps/api/src/access/access.module.ts
      - apps/api/src/people/public/person-by-cpf.ts
      - apps/api/src/people/infra/person-repository.ts
      - apps/api/src/core/http/env.ts
      - apps/api/src/app.module.ts
      - infra/.env.example
    protectedTests:
      - apps/api/src/access/application/portal-rate-limit.test.ts
      - apps/api/src/access/http/portal-session.http.test.ts
      - apps/api/src/access/http/portal-guard.http.test.ts
      - apps/api/src/core/http/env.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/access src/core/http src/people
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A13)
      - 'access/ imports only people/public and its own schema; it never imports lending or payments; people/public exposes only findPersonIdByCpf (returns the id, never the row)'
      - 'the token comes from crypto.randomBytes(32); only its SHA-256 is stored; the cookie is read from the Cookie header by hand (no new dependency); constants (30 attempts, 60 s, 30 min, 2 h) are named and in one file'
      - 'the entry does the same sequence of queries and writes the access_logs row before deciding; the CPF is never logged, stored or put in an error'
      - 'PILLA_ACCESS_HASH_KEY is required by readApiEnv and listed in infra/.env.example with no real value'
    hints:
      - pg_advisory_xact_lock(hashtext(ip)) at the start of the entry transaction, then count and insert
      - Retry-After = seconds until the oldest counted attempt leaves the window, at least 1
    budget: {attempts: 3, toolCalls: 50, minutes: 40}
    readFirst:
      - docs/plano/E15-F02/plano.md
      - apps/api/src/access/infra/schema.ts
      - apps/api/src/people/public/person-lookup.ts
      - apps/api/src/people/infra/schema.ts
      - apps/api/src/core/http/env.ts
      - apps/api/src/core/http/problem-exception.ts
      - apps/api/src/core/public/ids.ts
      - apps/api/src/lending/public/brasilia-today.ts
      - apps/api/src/app.module.ts
      - infra/.env.example

  # ---------------------------------------------------------------- E15-F03: habilitar/desabilitar (depende da E14)
  - id: E15-T05
    title: Write the HTTP tests for PUT and GET /portal-access/{personId}
    kind: test-author
    assignee: claude
    model: sonnet
    rules: [RN-A03]
    skills: [escrever-teste]
    refs: [PRD-001 RF-60, PRD-001 RN-A03, ADR-0006, ADR-0007, RFC-004 §3, RFC-005 §2, RFC-005 §7, docs/plano/E15.md D13, docs/plano/E15-F03/plano.md]
    dependsOn: [E15-T02, E15-T04, E14 admin login guard]
    allowedPaths:
      - apps/api/src/access/http/portal-access.http.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/access/http/portal-access.http.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/access/http/portal-access.http.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'enable (A1): a person with a CPF gets a portal_access row (enabled, enabled_at now, enabled_by the session admin) and one audit_log row PORTAL_ACCESS_ENABLED (actor_type ADMIN, actor_id the admin, entity_type portal_access, entity_id the person, before null, after {enabled: true}, ip)'
      - 'disable (A2): enabled false, enabled_at and enabled_by kept, version + 1, one PORTAL_ACCESS_DISABLED audit row, the CLIENT sessions of that person are deleted and the sessions of another person are kept'
      - 'idempotent (A3): repeating the current state returns 200, writes no audit row and does not change version'
      - 'errors (A4, A6): unknown person 404; enabling a person with no CPF 422 PERSON_WITHOUT_CPF and nothing written; disabling a person with no CPF and no row 200 and no row created; no admin session 401; a CLIENT portal session 403; no response carries the CPF'
      - 'transaction (A5): a failing audit insert rolls the portal_access change back'
      - 'GET (A7): returns the state; a person who never had a row gives enabled false and enabledAt null'
      - 'integration (A8): after disabling, the portal guard answers 401 for that person'
    budget: {attempts: 4, toolCalls: 35, minutes: 25}
    readFirst:
      - docs/plano/E15-F03/plano.md
      - apps/api/src/access/infra/portal-access.test.ts
      - apps/api/src/core/public/audit.ts
      - apps/api/src/lending/http/default-terms-update.http.test.ts
      - apps/api/src/core/http/test-app.ts
      - packages/schemas/src/api/access/portal-access.ts
  - id: E15-T06
