  # ---------------------------------------------------------------- E15-F04: leituras do portal
  - id: E15-T07
    title: Write the tests for the portal loan list and detail (isolation, leak and read-only)
    kind: test-author
    assignee: claude
    model: opus
    rules: [RN-A02, RN-A04, RN-E01, RN-E02]
    skills: [escrever-teste]
    refs: [PRD-001 RF-61, PRD-001 RF-62, PRD-001 RF-63, PRD-001 CA-09, ADR-0005, ADR-0007, RFC-004 §4, RFC-004 §5, docs/plano/E15.md D1 D2 D8 D9 D10 D11, docs/plano/E15-F04/plano.md]
    dependsOn: [E15-T02, E15-T04]
    allowedPaths:
      - apps/api/src/lending/http/portal-loans.http.test.ts
      - apps/api/src/payments/public/loan-payments.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/lending/http/portal-loans.http.test.ts src/payments/public/loan-payments.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/lending/http/portal-loans.http.test.ts apps/api/src/payments/public/loan-payments.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'list (A1): only the session person''s ACTIVE and PAID_OFF loans, ACTIVE first; situation CURRENT, OVERDUE or PAID_OFF; outstandingCents and nextDueDate (null when paid off); no loans gives {items: []}'
      - 'detail (A2, A3, A11): an ACTIVE current loan, an ACTIVE overdue loan (late charges > 0, installment OVERDUE, date injected) and a PAID_OFF loan match the admin GET /loans/{id} figures on the same date; nextInstallment is the first unpaid installment with total minus paid, null when paid off'
      - 'payments (A4, C16 to C18): only CONFIRMED and not reversed, oldest first, only paidAt, amountCents and method; PENDING_REVIEW, REJECTED and REVERSED seeded rows never show'
      - 'isolation (A5, A6): with the session of A, the detail of B''s loan and of an unknown id return 404 with an identical body; A''s list has no loan of B; ?personId= and ?cpf= are ignored; A''s DRAFT, CANCELLED and WRITTEN_OFF loans are 404 for A'
      - 'leak (A7): the JSON keys of the list and the detail (nested too) are exactly the schema keys; the serialized body does not contain the seeded CPF, name, phone, email, PIX key, internal notes or receipt text, and no payment id or account id'
      - 'guard (A8): no cookie, an expired session, access disabled after login and an ADMIN session all answer 401'
      - 'read-only (A9, A10): POST, PUT, PATCH and DELETE on /portal/loans and /portal/loans/{id} are never 2xx; a row count of every table is the same before and after a battery of reads'
    budget: {attempts: 4, toolCalls: 45, minutes: 35}
    readFirst:
      - docs/plano/E15-F04/plano.md
      - apps/api/src/lending/http/loans-read.http.test.ts
      - apps/api/src/lending/http/dashboard-today.http.test.ts
      - apps/api/src/lending/infra/schema.ts
      - apps/api/src/payments/infra/schema.ts
      - apps/api/src/people/infra/schema.ts
      - apps/api/src/access/infra/schema.ts
      - apps/api/src/core/http/test-app.ts
      - packages/schemas/src/api/access/portal-loans.ts
  - id: E15-T08
    title: Implement GET /portal/loans and GET /portal/loans/{id} with the portal guard
    kind: implement
    assignee: claude
    model: sonnet
    rules: [RN-A02, RN-E01, RN-E02]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-61, PRD-001 RF-62, PRD-001 RF-63, ADR-0005, ADR-0007, RFC-004 §4, docs/plano/E15.md D1 D2 D8 D9 D10 D11, docs/plano/E15-F04/plano.md]
    dependsOn: [E15-T07]
    allowedPaths:
      - apps/api/src/lending/http/portal-loans.controller.ts
      - apps/api/src/lending/application/portal-loans-service.ts
      - apps/api/src/lending/infra/loan-queries.ts
      - apps/api/src/lending/lending.module.ts
      - apps/api/src/payments/public/loan-payments.ts
      - apps/api/src/payments/infra/payment-repository.ts
    protectedTests:
      - apps/api/src/lending/http/portal-loans.http.test.ts
      - apps/api/src/payments/public/loan-payments.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/lending src/payments src/access
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A11)
      - 'the person filter is in the SQL (WHERE id = :id AND person_id = :personId AND status IN (ACTIVE, PAID_OFF)); personId comes only from @PortalPerson()'
      - 'the DTO is built field by field (a whitelist), never by spreading a row, and parsed with portalLoanListResponse or portalLoanDetailResponse before it is sent; Cache-Control no-store'
      - 'it reuses assessLoan, confirmedAllocationsByLoan and todayInBrasilia; no new calculation; payments/public/loan-payments.ts returns only paidAt, amountCents, method'
      - 'lending imports access/public, access never imports lending (depcruise)'
