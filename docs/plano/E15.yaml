      - packages/schemas/src/api/access/portal-loans.ts
      - packages/schemas/src/api/access/portal-access.ts
      - packages/schemas/src/index.ts
    protectedTests:
      - packages/schemas/src/api/access/portal-session.test.ts
      - packages/schemas/src/api/access/portal-loans.test.ts
      - packages/schemas/src/api/access/portal-access.test.ts
    checks:
      - pnpm --filter @pilla/schemas exec vitest run src/api/access
      - pnpm --filter @pilla/schemas typecheck
      - pnpm --filter @pilla/schemas lint
