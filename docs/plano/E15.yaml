  # ---------------------------------------------------------------- E15-F05A: web, entrada e lista
  - id: E15-T09
    title: Add the /portal CPF screen and the /portal/contratos list in plain language
    kind: implement
    assignee: claude
    model: sonnet
    rules: [RN-A04]
    skills:
      - shadcn
      - tailwind-css
      - react-best-practices
      - accessibility
      - coding-guidelines
    refs: [PRD-001 RF-61, PRD-001 RF-64, PRD-001 RN-A04, ADR-0011, ADR-0013, docs/plano/E15.md D12 D14 D15, docs/plano/E15-F05A/plano.md]
    dependsOn: [E15-T04, E15-T08]
