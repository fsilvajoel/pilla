    refs: [PRD-001 RF-60, ADR-0006, ADR-0007, RFC-004 §3, docs/plano/E15.md D13, docs/plano/E15-F03/plano.md]
    dependsOn: [E15-T05]
    allowedPaths:
      - apps/api/src/access/application/portal-access-service.ts
      - apps/api/src/access/http/portal-access.controller.ts
      - apps/api/src/access/access.module.ts
      - apps/api/src/people/public/person-lookup.ts
      - apps/api/src/core/http/messages.ts
      - docs/rfc/RFC-004-api-e-eventos.md
    protectedTests:
      - apps/api/src/access/http/portal-access.http.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/access src/people
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
