    hints:
      - the import lines of the done are the only imports of the file, each name in them is used, and nothing else is imported
      - open the database as persons.test.ts does, with let db and let client filled in beforeAll from migratedTestDb and client closed in afterAll
      - 'entry 1 is id "01970000-0000-7000-8000-000000000001", actorType "ADMIN", actorId "01970000-0000-7000-8000-000000000002", action "example.updated", entityType "example"'
      - 'entry 1 also has entityId "01970000-0000-7000-8000-000000000003", before { name: "Ana" }, after { name: "Ana Souza" }, at the Date of "2026-11-17T12:00:00.000Z" and ip "203.0.113.10"'
      - 'entry 2 is id "01970000-0000-7000-8000-000000000004", actorType "SYSTEM", actorId null, action "example.created", entityType "example", entityId "01970000-0000-7000-8000-000000000005"'
      - 'entry 2 also has before null, after { name: "Bia" }, at the Date of "2026-11-17T13:30:00.000Z" and ip null'
      - 'entry 3 is entry 1 spread with id "01970000-0000-7000-8000-000000000006"'
      - each entry is a const typed AuditEntry with every field written as a literal
      - the expected row of each entry is written out as a literal object with the snake case column names, never built from the entry
      - the select is client.query of "select actor_type, actor_id, action, entity_type, entity_id, before, after, at, ip from core.audit_log where id = $1" with the entry id, and toEqual is on rows
      - the row type of client.query is a local type with actor_type string, actor_id string or null, action, entity_type and entity_id string, before and after unknown, at Date and ip string or null
      - one it per entry, three it in one describe recordAudit
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
    budget:
      attempts: 4
      toolCalls: 16
      minutes: 10
    readFirst:
