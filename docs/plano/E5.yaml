      - recordAudit of entry 2 stores actor_id, before and ip as null and the other columns equal to the entry (RFC-005 §2, nullable columns)
      - after recordAudit of entry 3 succeeds, a second recordAudit of entry 3 rejects.toThrow, because id is the primary key (RFC-005 §2)
