delivery: E5
title: Domain services of the api (people first); Bia writes the tests, Alice the code
# Leva 17/11: só o que tem base em PRD/RFC aprovado e ADR aceita. createPerson, edição, busca, endereços, PIX e
# CONTRATOS ficam para depois das decisões do Joel (docs/plano/E5-F02/plano.md, seção Escopo, "Fora").
# Caminhos seguem o código atual (apps/api/src/<módulo>/...), não o src/modules/... da RFC-003 §3 (decisão pendente).
# Dados de teste (ids, nomes, CPF, telefone) vão nos hints: são entrada que o teste lê de volta, não valor calculado.
# IP de teste é de documentação (RFC 5737, 203.0.113.0/24): o repositório é público.
cards:
  - id: E5-T01
    title: Write the tests for uuidV7 and newId
    kind: test-author
    assignee: bia
    rules: []
    refs: [RFC-004 §2, RFC-005 §1]
    dependsOn: []
    allowedPaths:
      - apps/api/src/core/public/ids.test.ts
    protectedTests: []
    checks:
      - node scripts/expect-red.mjs apps/api src/core/public/ids.test.ts
      - node scripts/check-test-quality.mjs apps/api/src/core/public/ids.test.ts
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
    done:
      - every test fails now against the stub in HEAD and would pass with a correct implementation (run_check 0)
      - 'import { describe, expect, it } from "vitest";'
      - 'import { newId, uuidV7 } from "./ids";'
      - 'uuidV7 of unixMs 1645557742000 and the random bytes of the hints gives "017f22e2-79b0-7cc3-98c4-dc0c0c07398f" (RFC-004 §2, test vector of RFC 9562 A.6)'
      - 'uuidV7 of 0 and 10 zero bytes gives "00000000-0000-7000-8000-000000000000", of 281474976710655 and 10 bytes 0xff gives "ffffffff-ffff-7fff-bfff-ffffffffffff" (RFC-004 §2)'
      - uuidV7 throws RangeError for random of length 9 and 11 and for unixMs -1, 1.5 and 281474976710656 (RFC-004 §2, 48-bit time and 74 random bits)
      - newId toMatch /^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/ and two calls give different values (RFC-004 §2)
      - the time in the first 12 hex digits of newId is between Date.now taken right before and right after the call (RFC-004 §2, ordered by time)
      - never edit apps/api/src/core/public/ids.ts
    hints:
      - the import lines of the done are the only imports of the file, each name in them is used, and nothing else is imported
      - uuidV7 takes unixMs, a plain number of milliseconds, and random, a Uint8Array of exactly 10 bytes, and gives the UUID text in lower case
      - newId takes no argument and gives a string
      - the random bytes of the RFC 9562 vector are 0x7c 0xc3 0x98 0xc4 0xdc 0x0c 0x0c 0x07 0x39 0x8f, written with Uint8Array.of
      - the 10 bytes 0xff are a Uint8Array of length 10 filled with 0xff, and the 10 zero bytes are a new Uint8Array of length 10
      - the RangeError cases with a bad random pass unixMs 0, and the cases with a bad unixMs pass a new Uint8Array of length 10
      - each RangeError case is its own expect over a function that calls uuidV7, passed to toThrow with RangeError
      - for the time check, keep Date.now in a const before the call and another after it, drop the first dash of the id, read its first 12 hex digits with parseInt base 16, and compare with toBeGreaterThanOrEqual and toBeLessThanOrEqual
      - every expected value is a literal written in the test, never built with padStart or with text plus a variable
      - one describe for uuidV7 and one for newId
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
    budget:
      attempts: 4
      toolCalls: 16
      minutes: 8
    readFirst:
      - apps/api/src/core/public/ids.ts
    sizeNote: dois describe, 8 a 9 testes, ~60 linhas
  - id: E5-T02
    title: Implement uuidV7 and newId and remove the stub
    kind: implement
    assignee: alice
    rules: []
    refs: [RFC-004 §2, RFC-005 §1]
    dependsOn: [E5-T01]
    allowedPaths:
      - apps/api/src/core/public/ids.ts
      - apps/api/vitest.config.ts
    protectedTests:
      - apps/api/src/core/public/ids.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/core/public/ids.test.ts --coverage --coverage.include=src/core/public/ids.ts --coverage.exclude=none --coverage.thresholds.lines=100 --coverage.thresholds.branches=100
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
    done:
      - all tests in apps/api/src/core/public/ids.test.ts pass with 100% line and branch coverage of ids.ts (run_check 0)
      - ids.ts has no '// @stub E5-T02' line and apps/api/vitest.config.ts has no line that excludes src/core/public/ids.ts
      - uuidV7 throws RangeError when unixMs is not an integer, is below 0 or is above 281474976710655, and when random.length is not 10
      - newId gives uuidV7 of Date.now and of 10 bytes from crypto.getRandomValues
      - the signatures, the /** */ comments and the parameter types stay, and the parameters lose the leading underscore
      - ids.ts gets no import line
    hints:
      - the only file read is apps/api/src/core/public/ids.ts, because the steps are in these hints
      - the byte layout is RFC 9562 §5.7, the UUID v7 of RFC-004 §2, in 16 bytes
      - bytes 0 to 5 hold the 48-bit time big-endian, and bytes 6 to 15 hold the 10 random bytes as they come
      - then the high 4 bits of byte 6 become 0111, the version 7, and the high 2 bits of byte 8 become 10, the variant
      - keep the 16 bytes in a Uint8Array and read and write them through a DataView over its buffer, with setBigUint64 at offset 0 for the time shifted left by 16 bits as a BigInt, then set of the random at offset 6
      - change bytes 6 and 8 with getUint8 and setUint8 and the bit operators and with or
      - never read a byte by index, since the strict tsconfig makes it possibly undefined and its guard would be a branch no test reaches
      - the text is the 32 lower case hex digits, two per byte with a leading zero, split 8, 4, 4, 4 and 12 by dashes
      - the two guards come first, one if on the three unixMs conditions and one if on the length, each throwing a RangeError
      - crypto is a global of Node, so newId needs no import
      - the line of vitest.config.ts to delete is the one inside coverage.exclude with src/core/public/ids.ts and the comment stub E5-T02
      - one edit_file of ids.ts that replaces the two function bodies and deletes the stub line, one edit_file of apps/api/vitest.config.ts that deletes the line with stub E5-T02, then run_check 0, 1 and 2
    budget:
      attempts: 4
      toolCalls: 17
      minutes: 8
    readFirst:
      - apps/api/src/core/public/ids.ts
      - apps/api/vitest.config.ts
    sizeNote: duas funções, ~20 linhas; vitest.config.ts perde 1 linha
  - id: E5-T03
    title: Write the tests for recordAudit
