  - id: E5-T05
    title: Write the tests for insertPerson and findPersonById
    kind: test-author
    assignee: bia
    rules: [RN-P01, RN-P02]
    refs: [PRD-001 RF-01, PRD-001 RF-04, RFC-005 §3]
    dependsOn: []
    allowedPaths:
      - apps/api/src/people/infra/person-repository.test.ts
    protectedTests: []
    checks:
      - node scripts/expect-red.mjs apps/api src/people/infra/person-repository.test.ts
      - node scripts/check-test-quality.mjs apps/api/src/people/infra/person-repository.test.ts
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
    done:
      - every test fails now against the stub in HEAD and would pass with a correct implementation (run_check 0)
      - 'import type { PGlite } from "@electric-sql/pglite";'
      - 'import type { PgliteDatabase } from "drizzle-orm/pglite";'
      - 'import { afterAll, beforeAll, describe, expect, it } from "vitest";'
      - 'import { migratedTestDb } from "../../db/test-db";'
      - 'import { findPersonById, insertPerson } from "./person-repository";'
      - insertPerson of Maria resolves toBeUndefined and her row has email, birth_date, referred_by_id and notes null, active true and version 1 (RFC-005 §3 defaults)
      - insertPerson of Ana and then of João stores every field of João, his cpf null and his referred_by_id the id of Ana (RN-P02, RN-P01 lets cpf be null)
      - after insertPerson of Rui succeeds, insertPerson of Rui Filho with the same cpf rejects.toThrow (RN-P01, unique cpf)
      - findPersonById of Carla, inserted by SQL, toMatchObject her fields in camelCase with the defaults, and its createdAt toBeInstanceOf Date (PRD-001 RF-04)
      - findPersonById of an id that is not in the table resolves toBeNull (PRD-001 RF-04)
      - never edit apps/api/src/people/infra/person-repository.ts
    hints:
      - the import lines of the done are the only imports of the file, each name in them is used, and nothing else is imported
      - open the database as persons.test.ts does, with let db and let client filled in beforeAll from migratedTestDb and client closed in afterAll
      - 'Maria is id "01970000-0000-7000-8000-000000000001", fullName "Maria Souza", cpf "52998224725", phone "+5511987654321", and nothing else'
      - 'Ana is id "01970000-0000-7000-8000-000000000002", fullName "Ana Costa", cpf null, phone "+5511900000002"'
      - 'João is id "01970000-0000-7000-8000-000000000003", fullName "João Lima", cpf null, phone "+5521912345678", email "joao@example.com", birthDate "1985-03-09"'
      - 'João also has referredById "01970000-0000-7000-8000-000000000002" and notes "indicado pela Ana"'
      - 'Rui is id "01970000-0000-7000-8000-000000000004", fullName "Rui Alves", cpf "11144477735", phone "+5511900000004"'
      - 'Rui Filho is id "01970000-0000-7000-8000-000000000005", fullName "Rui Alves Filho", cpf "11144477735", phone "+5511900000005"'
      - 'Carla is id "01970000-0000-7000-8000-000000000010", full_name "Carla Dias", cpf "39053344705", phone "+5531988887777", birth_date "1992-07-01"'
      - 'the unknown id is "01970000-0000-7000-8000-000000000099"'
      - insertPerson takes the db and one object of the columns of persons in camelCase, so the optional fields not used are left out, never set to undefined
      - the select after insertPerson is client.query of "select full_name, cpf, phone, email, birth_date::text as birth_date, referred_by_id, notes, active, version from people.persons where id = $1" with the id, and toEqual is on rows
      - birth_date goes through ::text in that select, because a raw date column read by client.query comes back as Date, not as text
      - Carla goes in with client.query of "insert into people.persons (id, full_name, cpf, phone, birth_date) values ($1, $2, $3, $4, $5)" and her five values
      - 'findPersonById of Carla gives birthDate "1992-07-01" as text, email, referredById, notes and anonymizedAt null, active true and version 1'
      - every expected row and object is a literal written in the test, never built from the input
      - one describe insertPerson with three it and one describe findPersonById with two it
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
    budget:
      attempts: 4
      toolCalls: 16
      minutes: 10
    readFirst:
      - apps/api/src/people/infra/person-repository.ts
      - apps/api/src/people/infra/persons.test.ts
    sizeNote: dois describe, 5 testes, ~100 linhas
