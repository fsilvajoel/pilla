    kind: implement
    assignee: baidu
    rules: [RN-E01, RN-E02, RN-E03]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-50, ADR-0005, RFC-002 §3.5, RFC-004 §3, docs/plano/E10.md D5 D11, docs/plano/E13.md D1 D2 D3 D7, docs/plano/E13-F02A/plano.md]
    dependsOn: [E13-T03]
