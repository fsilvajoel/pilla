  - id: E13-T02
    title: Implement default terms editing as a new effective row, with audit
    kind: implement
    assignee: baidu
    rules: [RN-E03]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-40, ADR-0006, ADR-0008, RFC-004 §3, docs/plano/E13.md D5 D6, docs/plano/E13-F01/plano.md]
    dependsOn: [E13-T01, E13-T07]
    allowedPaths:
      - packages/schemas/src/api/lending/update-default-terms.ts   # novo
      - packages/schemas/src/index.ts
      - apps/api/src/lending/application/**
      - apps/api/src/lending/http/default-terms.controller.ts
      - apps/api/src/lending/infra/default-terms-repository.ts
    protectedTests:
      - packages/schemas/src/api/lending/update-default-terms.test.ts
      - apps/api/src/lending/http/default-terms-update.http.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/lending
      - pnpm --filter @pilla/schemas exec vitest run src/api/lending
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm check:schemas
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A9)
      - PUT only inserts (no UPDATE or DELETE on default_terms) and the insert and the audit row share one transaction (ADR-0006)
      - findCurrentDefaultTerms orders by effective_from desc then id desc, so two rows in the same instant resolve the same way every time
      - the loans table and the loan-creation code are not touched (ADR-0008 holds by construction)
    hints:
      - copy the audit call and the transaction shape of the draft creation in loans-service.ts (auditEntry, action name default_terms.updated)
      - updateDefaultTermsRequest reuses bpsSchema and positiveCentsSchema from common.ts and adds a max per field (see the plano); keep it a strictObject
      - compare the new body with findCurrentDefaultTerms before inserting; equal values return the current terms with no insert and no audit
    budget: {attempts: 3, toolCalls: 40, minutes: 30}
    readFirst:
      - docs/plano/E13-F01/plano.md
      - apps/api/src/lending/http/default-terms.controller.ts
      - apps/api/src/lending/application/loans-service.ts
      - apps/api/src/lending/infra/default-terms-repository.ts
      - apps/api/src/core/public/audit.ts
      - packages/schemas/src/api/lending/create-loan.ts
    sizeNote: um schema curto, um método de serviço e uma rota

