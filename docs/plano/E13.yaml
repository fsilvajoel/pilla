    title: Write the HTTP tests for PUT /settings/default-terms (new effective row, audit, frozen contracts)
    kind: test-author
    assignee: claude
    rules: [RN-E03]
    skills: [escrever-teste]
    refs: [PRD-001 RF-40, PRD-001 RF-41, PRD-001 CA-10, ADR-0006, ADR-0008, RFC-004 §3, RFC-004 §6, docs/plano/E13.md D5 D6, docs/plano/E13-F01/plano.md]
    dependsOn: [E13-T01]
