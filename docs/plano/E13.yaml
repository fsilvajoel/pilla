    title: Write the HTTP tests for GET /dashboard/today (due today, due this week, overdue)
    kind: test-author
    assignee: claude
    rules: [RN-E01, RN-E02, RN-E03]
    skills: [escrever-teste]
    refs: [PRD-001 RF-50, ADR-0005, RFC-002 §3.5, RFC-004 §3, docs/plano/E10.md D11, docs/plano/E13.md D2 D3 D4 D7, docs/plano/E13-F02A/plano.md]
    dependsOn: [E13-T08]
    allowedPaths:
      - apps/api/src/lending/http/dashboard-today.http.test.ts   # novo
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/lending/http/dashboard-today.http.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/lending/http/dashboard-today.http.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'buckets (A1 to A4, C1 to C8): an open installment due today is in dueToday; due tomorrow and due in 7 days are in dueThisWeek; due in 8 days is in none; due yesterday is in overdue; a PAID installment is in none; installments of DRAFT, CANCELLED, PAID_OFF and WRITTEN_OFF loans are in none'
      - 'amounts (A5, A6, C9 to C13): openCents is principal plus interest still open after confirmed allocations; a partial payment lowers it and the status is PARTIAL or OVERDUE_PARTIAL; totals equal the sum of the items'
      - 'overdue (A7 to A9, C14 to C19): daysOverdue is today minus the due date in days; lateChargesCents equals @pilla/finance at today in Brasília on the open balance; with grace 0 an installment 1 day late already has charges; with grace 3 it is overdue with lateChargesCents 0 until day 4; totalDueCents is openCents plus lateChargesCents'
      - 'order (A13, C20 to C22): dueToday by loan number, dueThisWeek by due date, overdue by daysOverdue descending, ties by loan number then installment number'
      - 'pending placeholder (A14, C23): pendingReview is {count 0, totalCents 0, items []} even when PENDING_REVIEW rows exist (the F02B fills it); the test is marked so the F02B replaces it'
      - 'no storage (A15, C24): the call writes no row in any table (ADR-0005) and an empty database answers 200 with four empty blocks'
    budget: {attempts: 4, toolCalls: 30, minutes: 20}
    readFirst:
      - docs/plano/E13-F02A/plano.md
      - apps/api/src/lending/http/loans-read.http.test.ts
