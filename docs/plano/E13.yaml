      - node scripts/check-test-quality.mjs apps/api/src/lending/http/default-terms-update.http.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'update (A1 to A4, C1 to C6): PUT with the five fields answers 200 with the new values; a second row exists in default_terms and the first is untouched; GET right after returns the new values; two PUTs in a row leave the last one current'
      - 'audit (A5, C7 to C9): one audit_log row per change, action default_terms.updated, entityType default_terms, before the old terms and after the new ones, written in the same transaction (a forced failure of the audit insert leaves no new default_terms row)'
      - 'frozen contract (A6, A7, C10 to C13): a loan created before the PUT keeps its late fee, late interest, grace and rounding step (GET /loans/{id}); a loan created after the PUT carries the new values (CA-10, ADR-0008)'
