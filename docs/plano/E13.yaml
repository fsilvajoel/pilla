      - pnpm --filter @pilla/schemas exec vitest run src/api/lending
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm check:schemas
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A15), including the E10 read tests (the shared helpers were reused, not copied)
      - the schema file defines the full contract of docs/plano/E13-F02A/plano.md (four blocks, pendingReview included) and the controller returns pendingReview as the fixed empty block
      - no computed value is stored (ADR-0005); open amounts and charges come from assessLoan and @pilla/finance, today comes from todayInBrasilia
      - installments are read in batch for the ACTIVE loans (selectInstallmentsByLoan), not one query per installment
    hints:
      - export the per-installment open amount helper that assessLoan already uses (openInstallments in loan-assessment.ts) instead of rewriting it
      - add selectActiveLoans(db) to loan-queries.ts (status ACTIVE, ordered by loan_number); do not reuse the paginated selectLoanPage
      - week window is today+1 to today+7 inclusive (pendência E13-F02A, default a); keep the 7 in one named constant
      - personName comes from findPersonNames (people/public), as in the list
    budget: {attempts: 3, toolCalls: 40, minutes: 30}
    readFirst:
