delivery: E4
title: Small pure helpers from travas.md §4.7 (fake CPF for tests, log redaction); Alice writes tests and code
cards:
  - id: E4-T01
    title: Write tests for fakeCpf
    kind: test-author
    assignee: alice
    rules: [RN-P01]
    refs: [RFC-005 §3]
    dependsOn: []
    allowedPaths:
      - packages/schemas/src/fake-cpf.test.ts
    protectedTests: []
    checks:
      - node scripts/expect-red.mjs packages/schemas src/fake-cpf.test.ts
      - node scripts/check-test-quality.mjs packages/schemas/src/fake-cpf.test.ts
      - pnpm --filter @pilla/schemas typecheck
      - pnpm --filter @pilla/schemas lint
    done:
      - every test fails now (the stub throws) and would pass with a correct implementation (run_check 0)
      - 'import { fakeCpf } from "./fake-cpf";'
      - 'import { cpfSchema } from "./common";'
      - for every integer seed from 1 to 999, fakeCpf(seed) has 11 digits and cpfSchema.safeParse(fakeCpf(seed)).success is true (RN-P01)
      - 'the first 9 digits are the seed with leading zeros: fakeCpf(42).slice(0, 9) is "000000042" and fakeCpf(123456789).slice(0, 9) is "123456789" (contract in fake-cpf.ts, RN-P01)'
      - the same seed twice returns the same CPF, and fakeCpf(1) differs from fakeCpf(2)
      - throws RangeError for -1, 1000000000, 1.5 and NaN (not an integer from 0 to 999_999_999)
      - throws RangeError for 0, 111111111 and 999999999 (the 9 digits are all equal)
      - never edit packages/schemas/src/fake-cpf.ts
    hints:
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
      - assert properties and the literal strings of the done list, and never build the expected CPF in the test (padStart and charCodeAt are refused by run_check 1)
      - a plain for loop inside one it covers the seeds 1 to 999, and it.each fits the lists of seeds that throw
    budget:
      attempts: 4
      toolCalls: 25
      minutes: 8
    readFirst:
      - packages/schemas/src/fake-cpf.ts
      - packages/schemas/src/common.ts
    sizeNote: uma função; o teste tem ~40 linhas e é o par do E4-T02
  - id: E4-T02
    title: Implement fakeCpf
    kind: implement
    assignee: alice
    rules: [RN-P01]
    refs: [RFC-005 §3]
    dependsOn: [E4-T01]
    allowedPaths:
      - packages/schemas/src/fake-cpf.ts
    protectedTests:
      - packages/schemas/src/fake-cpf.test.ts
    checks:
      - pnpm --filter @pilla/schemas exec vitest run src/fake-cpf.test.ts --coverage --coverage.include=src/fake-cpf.ts
      - pnpm --filter @pilla/schemas typecheck
      - pnpm --filter @pilla/schemas lint
    done:
      - all tests in packages/schemas/src/fake-cpf.test.ts pass with 100% line and branch coverage of fake-cpf.ts (run_check 0)
      - 'export function fakeCpf(seed: number): string {'
      - keep the /** */ comment above fakeCpf unchanged
      - no import from ./common (the check digits are computed in fake-cpf.ts)
    hints:
      - the check digits follow the same rule as cpfCheckDigit in packages/schemas/src/common.ts (RN-P01), so write that rule again inside fake-cpf.ts
      - one write_file of the whole file, then run_check 0, 1 and 2
    budget:
      attempts: 4
      toolCalls: 25
      minutes: 8
    readFirst:
      - packages/schemas/src/fake-cpf.ts
      - packages/schemas/src/fake-cpf.test.ts
      - packages/schemas/src/common.ts
    sizeNote: uma função
  - id: E4-T03
    title: Write tests for redact
    kind: test-author
    assignee: alice
    rules: []
    refs: [RFC-003 §4.1]
    dependsOn: []
    allowedPaths:
      - apps/api/src/log/redact.test.ts
    protectedTests: []
    checks:
      - node scripts/expect-red.mjs apps/api src/log/redact.test.ts
      - node scripts/check-test-quality.mjs apps/api/src/log/redact.test.ts
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
    done:
      - every test fails now (the stub throws) and would pass with a correct implementation (run_check 0)
      - 'import { REDACTED, redact } from "./redact";'
      - each of the keys cpf, phone, email, password and token has its value replaced by REDACTED
      - keys that end with a sensitive name are redacted too, ignoring case (accessToken, ownerCpf, userEmail, PASSWORD), and other keys keep their value (name, amountCents, id)
      - nested objects and objects inside arrays are redacted at any depth
      - the input object is not changed (compare it with a structuredClone made before the call)
      - a Date, an Error, a string, a number and null are returned as they came (toBe)
      - never edit apps/api/src/log/redact.ts
    hints:
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
      - 'use it.each for the list of sensitive keys, and build plain input objects like { ownerCpf: "x", name: "Ana" }'
      - the expected value is always REDACTED or the same input value, never one computed in the test
      - never write any because the lint refuses it, and compare the whole result with toEqual against a plain object literal, so no cast or property access is needed
    budget:
      attempts: 4
      toolCalls: 25
      minutes: 8
    readFirst:
      - apps/api/src/log/redact.ts
    sizeNote: uma função; o teste tem ~50 linhas e é o par do E4-T04
