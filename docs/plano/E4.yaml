delivery: E4
title: Small pure helpers from travas.md §4.7 (fake CPF for tests, log redaction); Alice writes tests and code
cards:
  - id: E4-T01
    title: Write tests for fakeCpf
    kind: test-author
    assignee: alice
    rules: [RN-P01]
    refs: [RFC-005 §3]
    dependsOn: []
    allowedPaths:
      - packages/schemas/src/fake-cpf.test.ts
    protectedTests: []
    checks:
      - node scripts/expect-red.mjs packages/schemas src/fake-cpf.test.ts
      - pnpm --filter @pilla/schemas typecheck
      - pnpm --filter @pilla/schemas lint
    done:
      - every test fails now (the stub throws) and would pass with a correct implementation (run_check 0)
      - 'import { fakeCpf } from "./fake-cpf";'
      - 'import { cpfSchema } from "./common";'
      - fakeCpf(1) returns "00000000191" and fakeCpf(123456789) returns "12345678909"
      - for every seed from 0 to 999 that does not throw, cpfSchema.safeParse(fakeCpf(seed)).success is true (RN-P01)
      - the same seed twice returns the same CPF; seeds 1 and 2 return different CPFs
      - throws RangeError for -1, 1000000000, 1.5 and NaN
      - throws RangeError for 0 and 111111111 (the 9 digits are all equal)
      - never edit packages/schemas/src/fake-cpf.ts
    hints:
      - one write_file of the whole test file, then run_check 0, 1 and 2
      - use it.each for the lists of seeds that throw
    budget:
      attempts: 4
      toolCalls: 25
      minutes: 8
    readFirst:
      - packages/schemas/src/fake-cpf.ts
      - packages/schemas/src/common.ts
    sizeNote: uma função; o teste é o par do E4-T02
