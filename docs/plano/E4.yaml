  - id: E4-T03
    title: Write tests for redact
    kind: test-author
    assignee: alice
    rules: []
    refs: [RFC-003 §4.1]
    dependsOn: []
    allowedPaths:
      - apps/api/src/log/redact.test.ts
    protectedTests: []
