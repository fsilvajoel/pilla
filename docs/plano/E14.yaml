      - pnpm --filter @pilla/api exec vitest run src/access src/core
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A10)
      - '@nestjs/throttler is applied only to POST /auth/admin/login and its exception becomes 429 TOO_MANY_REQUESTS problem+json'
      - the cookie is parsed from the Cookie header without new dependencies; session lifetimes (2 h idle, 12 h absolute, 1 min touch) are named constants
