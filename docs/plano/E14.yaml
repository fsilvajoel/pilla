    done:
      - 'guard (A1 to A4, C1 to C6): a route without @Public gives 401 UNAUTHENTICATED with no cookie, an unknown token or an expired session; a CLIENT session gives 403 FORBIDDEN; a valid ADMIN session passes and @CurrentActor() receives {type ADMIN, adminUserId, ip}'
      - 'public routes (A5, C7, C8): GET /api/v1/health, the OpenAPI route and POST /api/v1/auth/admin/login answer without a cookie; POST /api/v1/auth/admin/logout and GET /api/v1/auth/me are not public'
      - 'ip (A6, C9, C10): with the connection from 127.0.0.1 the actor ip is the first X-Forwarded-For address; without the header it is the connection address'
      - 'whole app (A7, C11, C12): AppModule.forRoot with PGlite answers 401 on GET /api/v1/people and GET /api/v1/loans without a cookie, and 200 after logging in through POST /api/v1/auth/admin/login'
      - 'test helper (A8, C13): createTestApp without the actor option injects TEST_ADMIN_ACTOR; with {actor: null} the controller sees no actor'
    budget: {attempts: 4, toolCalls: 35, minutes: 25}
