  # ---------------------------------------------------------------- E14-F02: login, logout, me
  - id: E14-T03
    title: Write the HTTP tests for admin login, logout and me with session cookie and rate limit
    kind: test-author
    assignee: claude
    rules: [RN-A05]
    skills: [escrever-teste]
    refs: [PRD-001 RN-A05, ADR-0011, RFC-003 §4.5, RFC-004 §3, RFC-004 §6, RFC-005, docs/plano/E14.md D3 D4 D5 D6, docs/plano/E14-F02/plano.md]
    dependsOn: [E14-T02]
    allowedPaths:
      - apps/api/src/access/application/sessions.test.ts
      - apps/api/src/access/http/auth.http.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/access/application/sessions.test.ts src/access/http/auth.http.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/access/application/sessions.test.ts apps/api/src/access/http/auth.http.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'login ok (A1 to A3, C1 to C4): right username and password give 200 with adminMeResponse and one Set-Cookie pilla_session with HttpOnly, Secure, SameSite=Lax and Path=/; the sessions row id is the SHA-256 of the cookie value, never the value itself; role ADMIN, ip from the request, expires_at = created_at + 12 h; admin_users.last_login_at is set'
      - 'login fails (A4, A5, C5 to C9): unknown user, wrong password and inactive user all give 401 UNAUTHENTICATED with the same detail and no Set-Cookie and no session row; body with extra key or empty password gives 400 VALIDATION_FAILED; the response body never contains the password'
      - 'rate limit (A6, C10, C11): the 6th login from the same IP inside one minute gives 429 TOO_MANY_REQUESTS problem+json, even with the right password; another IP still logs in'
      - 'me (A7 to A9, C12 to C16): with a valid cookie gives 200 adminMeResponse; no cookie, unknown token, session idle for more than 2 h, session past expires_at and session of an inactive admin all give 401; an expired session row is deleted; last_seen_at moves forward only when older than 1 minute (fake clock)'
      - 'logout (A10, C17, C18): with a valid cookie gives 204, deletes the row and returns an expired pilla_session cookie; the old cookie then gives 401 on me; without a cookie it also gives 204'
    budget: {attempts: 4, toolCalls: 35, minutes: 25}
    readFirst:
      - docs/plano/E14-F02/plano.md
      - apps/api/src/access/infra/schema.ts
      - apps/api/src/access/infra/sessions.test.ts
      - apps/api/src/access/domain/password.ts
      - apps/api/src/access/domain/session-token.ts
      - packages/schemas/src/api/access/admin-login.ts
      - apps/api/src/core/http/test-app.ts
      - apps/api/src/db/test-db.ts
      - apps/api/src/payments/http/payments-reverse.http.test.ts
