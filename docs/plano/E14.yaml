    title: Implement admin login, logout and me with server-side sessions and login rate limit
    kind: implement
    assignee: claude
    rules: [RN-A05]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [ADR-0007, ADR-0011, RFC-003 §4.5, RFC-004 §3, RFC-004 §6, docs/plano/E14.md D1 D3 D4 D5 D6, docs/plano/E14-F02/plano.md]
    dependsOn: [E14-T03]
    allowedPaths:
