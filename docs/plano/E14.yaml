    title: Write the tests for the admin seed function
    kind: test-author
    assignee: claude
    rules: [RN-A05]
    skills: [escrever-teste]
    refs: [PRD-001 RN-A05, ADR-0011, docs/plano/E14.md D9, docs/plano/E14-F05/plano.md]
