      - pnpm --filter @pilla/api typecheck
    done:
      - 'create (A1, C1, C2): seedAdmin(db, {username, password}) on an empty table inserts one active admin with a uuid v7 id and an argon2id hash that verifies the password; it returns "created"'
      - 'reset (A2, C3, C4): with the same username already present (even inactive) it replaces the hash, sets active true, bumps version, keeps the id and returns "updated"; other admins are untouched'
      - 'policy (A3, C5 to C8): a password with 11 characters or more than 200, an empty username and a username over 100 are rejected with an error and nothing is written; leading and trailing spaces of the username are trimmed'
      - 'no leak (A4, C9): the thrown error messages never contain the password'
