cards:
  # ---------------------------------------------------------------- E14-F01: contrato, hash e token
  - id: E14-T01
    title: Write the tests for the admin me response schema, the password hashing and the session token
    kind: test-author
    assignee: claude
    rules: [RN-A05]
    skills: [escrever-teste]
    refs: [PRD-001 RN-A05, ADR-0011, RFC-003 §4.5, RFC-004 §3, docs/plano/E14.md D2 D3 D5, docs/plano/E14-F01/plano.md]
    dependsOn: []
    allowedPaths:
      - packages/schemas/src/api/access/admin-me.test.ts
      - apps/api/src/access/domain/password.test.ts
      - apps/api/src/access/domain/session-token.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/schemas exec vitest run src/api/access/admin-me.test.ts'
      - '! pnpm --filter @pilla/api exec vitest run src/access/domain/password.test.ts src/access/domain/session-token.test.ts'
      - node scripts/check-test-quality.mjs packages/schemas/src/api/access/admin-me.test.ts apps/api/src/access/domain/password.test.ts apps/api/src/access/domain/session-token.test.ts
    done:
      - 'schema (A1, A2, C1 to C4): adminMeResponse accepts {id uuid, username 1..100, role "ADMIN"} and rejects extra keys, role CLIENT, a non-uuid id and an empty username'
      - 'password (A3 to A6, C5 to C10): hashPassword returns an argon2id encoded string with m=19456, t=2, p=1 and a different salt each call; verifyPassword is true only for the same password, false for a wrong one, false (never throws) for a malformed hash; verifyAgainstDummy always returns false and runs a real verify'
      - 'token (A7, A8, C11 to C13): newSessionToken returns a 43-char base64url token from 32 random bytes and two calls differ; sessionIdOf(token) is the 64-char lowercase hex SHA-256 of the token and is stable'
    budget: {attempts: 3, toolCalls: 25, minutes: 15}
    readFirst:
      - docs/plano/E14-F01/plano.md
      - packages/schemas/src/api/access/admin-login.ts
      - packages/schemas/src/api/api.test.ts
      - apps/api/src/access/infra/schema.ts
      - docs/adr/0011-autenticacao-cpf-senha-sessao.md
