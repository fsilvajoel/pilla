      - apps/api/src/people/infra/**
      - apps/api/src/lending/public/import-loan.ts
      - apps/api/src/lending/application/**
      - apps/api/src/lending/infra/**
      - apps/api/src/payments/public/record-imported-payment.ts
      - apps/api/src/payments/application/**
      - apps/api/src/payments/infra/**
    protectedTests:
      - apps/api/src/people/public/create-imported-person.test.ts
      - apps/api/src/lending/public/import-loan.test.ts
      - apps/api/src/payments/public/record-imported-payment.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/people src/lending src/payments
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - 'the protected tests pass (A1 to A13)'
      - 'no migration and no new column in people, lending or payments'
      - 'existing people, lending and payments tests stay green'
      - 'ports take the caller transaction and are exported only from each module public/'
    budget: {attempts: 4, toolCalls: 45, minutes: 35}
    readFirst:
      - docs/plano/E16-F03/plano.md
      - apps/api/src/lending/public/mark-loan-paid-off.ts
      - apps/api/src/lending/infra/loan-repository.ts
      - apps/api/src/payments/application/payments-service.ts
  - id: E16-T07
    title: Write the HTTP tests for POST /imports/spreadsheet and GET /imports/{id}
    kind: test-author
    assignee: sonnet
    rules: [RF-70, RN-P01]
    skills: [escrever-teste]
    refs: [PRD-001 RF-70, PRD-001 RN-P01, RFC-004 §3, RFC-004 §6, RFC-005 §6, ADR-0006, docs/plano/E16.md D2 D6 D7 D8 D9 D10, docs/plano/E16-F04/plano.md]
    dependsOn: [E16-T04, E16-T06]
    allowedPaths:
      - apps/api/src/imports/http/imports.http.test.ts
      - apps/api/src/imports/http/imports-ledger.http.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/imports/http'
      - node scripts/check-test-quality.mjs apps/api/src/imports/http/imports.http.test.ts apps/api/src/imports/http/imports-ledger.http.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'auth (A1): only ADMIN; 401 and 403 as the other admin routes'
      - 'validation (A2): empty body, header without a required column, over 2000 rows or over 2 MB answers 422 or 400 VALIDATION_FAILED and creates nothing'
      - 'happy path (A3, A4): a fictional CSV with consistent, review and rejected rows answers 201 with totals; consistent rows create person, ACTIVE loan with originType IMPORT and one CONFIRMED payment; review rows create a CUSTOM loan listed with reasons; rejected rows create nothing'
      - 'persons (A5): same valid CPF reuses the person, blank CPF creates cpf null and counts personsWithoutCpf, same name without CPF in one file reuses the person with DUPLICATE_PERSON_NAME'
      - 'isolation (A6): a failing row (forced) is REJECTED and the other rows are kept'
      - 'idempotency (A7): the same file again answers 409 IMPORT_ALREADY_DONE with the first batch id and creates nothing'
      - 'report (A8): GET returns the same report, only REVIEW and REJECTED rows listed, 404 for an unknown id; the audit log has import.created'
      - 'ledger (A9, needs E12-T02): after dispatchOutbox the account has a negative DISBURSEMENT dated data_contrato per loan and REPAYMENT rows dated data_ultimo_pagamento'
      - 'no test uses real data (fake CPFs from packages/schemas)'
    budget: {attempts: 4, toolCalls: 45, minutes: 35}
    readFirst:
      - docs/plano/E16-F04/plano.md
      - apps/api/src/core/http/test-app.ts
      - apps/api/src/db/test-db.ts
      - apps/api/src/payments/http/payments-reverse.http.test.ts
      - apps/api/src/treasury/http/ledger-from-events.http.test.ts
  - id: E16-T08
    title: Implement the imports module (tables, POST /imports/spreadsheet, GET /imports/{id})
    kind: implement
    assignee: sonnet
    rules: [RF-70, RN-P01]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-70, RFC-001 M2, RFC-004 §3, RFC-005 §6, ADR-0002, ADR-0006, docs/plano/E16.md D1 D2 D8 D9 D10, docs/plano/E16-F04/plano.md]
    dependsOn: [E16-T07]
    allowedPaths:
      - apps/api/src/imports/**
      - apps/api/migrations/imports/0000_imports.sql
      - apps/api/migrations/imports/meta/**
      - apps/api/src/app.module.ts
      - apps/api/src/db/**
    protectedTests:
      - apps/api/src/imports/http/imports.http.test.ts
      - apps/api/src/imports/http/imports-ledger.http.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/imports src/people src/lending src/payments src/treasury
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm check:schemas
      - pnpm depcruise
    done:
      - 'the protected tests pass (A1 to A9)'
      - 'one transaction per row; the batch row and its audit are written in their own transaction after the rows'
      - 'imports reaches people, lending and payments only through their public/ ports; no module imports imports'
      - 'migration creates schema imports with import_batches (file_sha256 unique) and import_rows, no cross-module foreign key'
      - 'no tool or library outside the lockfile; multipart not needed (text/csv body)'
    budget: {attempts: 4, toolCalls: 50, minutes: 40}
    readFirst:
      - docs/plano/E16-F04/plano.md
      - apps/api/src/payments/payments.module.ts
      - apps/api/src/app.module.ts
      - apps/api/src/treasury/infra/schema.ts
  - id: E16-T09
    title: Implement the web client for the imports API
    kind: implement
    assignee: haiku
    rules: [RF-70]
    skills: [editar-arquivo, coding-guidelines, react-best-practices]
    refs: [PRD-001 RF-70, docs/plano/E16.md D11, docs/plano/E16-F05/plano.md]
    dependsOn: [E16-T08]
    allowedPaths:
      - apps/web/lib/api/imports.ts
    protectedTests: []
    checks:
      - pnpm --filter @pilla/web typecheck
      - pnpm --filter @pilla/web lint
    done:
      - 'uploadSpreadsheet(file) sends the CSV text with Content-Type text/csv and getImport(id) returns the importReportResponse; both typed with @pilla/schemas, no any'
      - 'a 409 IMPORT_ALREADY_DONE is returned as a typed result carrying the existing batch id, not thrown as a generic error'
    budget: {attempts: 4, toolCalls: 20, minutes: 15}
    readFirst:
      - docs/plano/E16-F05/plano.md
      - apps/web/lib/api
  - id: E16-T10
    title: Implement the /importacao screen (upload, summary and the "a revisar" list)
    kind: implement
    assignee: sonnet
    rules: [RF-70]
    skills: [editar-arquivo, coding-guidelines, shadcn, tailwind-css, accessibility]
    refs: [PRD-001 RF-70, docs/plano/E16.md D9 D11, docs/plano/E16-F05/plano.md]
    dependsOn: [E16-T09]
    allowedPaths:
      - apps/web/app/(admin)/importacao/**
      - apps/web/components/**
      - apps/web/lib/labels.ts
    protectedTests: []
    checks:
      - pnpm --filter @pilla/web typecheck
      - pnpm --filter @pilla/web lint
      - pnpm --filter @pilla/web test
    done:
      - 'file picker accepts .csv, shows the expected column list (D3) and a warning that uploading an altered file again creates the records again'
      - 'after upload shows the totals and a table of REVIEW and REJECTED rows with line number, reasons in pt-BR (labels.ts) and links to the loan and the person'
      - '409 shows a message with a link to the existing report; loading, empty and error states exist'
      - 'menu admin gets the Importação item; no unit test for the screen (ADR-0017 amendment)'
    budget: {attempts: 3, toolCalls: 45, minutes: 40}
    readFirst:
      - docs/plano/E16-F05/plano.md
      - apps/web/app/(admin)/layout.tsx
      - apps/web/app/(admin)/configuracoes
      - apps/web/lib/labels.ts
  - id: E16-T11
    title: Write the end-to-end test for importing a spreadsheet
    kind: test-author
    assignee: sonnet
    rules: [RF-70, RN-P01]
    skills: [escrever-teste, accessibility]
    refs: [PRD-001 RF-70, PRD-001 RN-P01, docs/plano/E16.md, docs/plano/E16-F06/plano.md]
    dependsOn: [E16-T10]
    allowedPaths:
      - apps/web/e2e/imports.e2e.ts
    protectedTests: []
    checks:
      - pnpm --filter @pilla/web e2e
    done:
      - 'with compose up, migrate and seed: upload a fictional CSV (consistent, review, rejected and blank-CPF rows) on /importacao and see the totals and the "a revisar" table with the right reasons'
      - 'open a listed loan: it is ACTIVE, shows the imported payment and, for a review row, type Personalizado; open a person without CPF and see the pending CPF'
      - 'on /caixa see the DISBURSEMENT and REPAYMENT rows with the historical dates after the dispatcher runs (re-read with expect timeout, never waitForTimeout)'
      - 'upload the same file again and see the already-imported message; no console errors; unique names per run'
    budget: {attempts: 3, toolCalls: 50, minutes: 40}
    readFirst:
      - docs/plano/E16-F06/plano.md
      - apps/web/e2e/payments.e2e.ts
      - apps/web/e2e/treasury.e2e.ts
      - apps/web/playwright.config.ts

