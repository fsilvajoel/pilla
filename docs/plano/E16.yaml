delivery: E16
title: Spreadsheet history import (RF-70)
# Plano e decisões D1–D11 em docs/plano/E16.md; escopo e critérios de cada feature em docs/plano/E16-F0x/plano.md.
# Cartões em inglês (ADR-0012). Trabalhador (assignee): haiku simples, sonnet médio, opus só o difícil (ver E16.md).
# Todo cartão que toca apps/web leva skills; cartão de tela leva também shadcn e tailwind-css (gate card-skills).
# readFirst só com arquivos (o run_card do harness recusa pasta), exceto onde indicado.
# Dúvidas de produto com padrão assumido: docs/plano/pendencias-pm.md (E16-T03 a E16-T07).
# Dependência externa: E11 pronta; E12-T02 só para o teste de ledger (A9) do E16-T07.
cards:
  - id: E16-T01
    title: Write the schema tests for importReportResponse and the review reasons
    kind: test-author
    assignee: haiku
    rules: [RF-70]
    skills: [escrever-teste]
    refs: [PRD-001 RF-70, RFC-004 §3, RFC-004 §6, ADR-0004, docs/plano/E16.md D3 D4 D9, docs/plano/E16-F01/plano.md]
    dependsOn: []
    allowedPaths:
      - packages/schemas/src/api/imports/import-report.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/schemas exec vitest run src/api/imports/import-report.test.ts'
      - node scripts/check-test-quality.mjs packages/schemas/src/api/imports/import-report.test.ts
      - pnpm --filter @pilla/schemas typecheck
    done:
      - 'importReportResponse accepts the report shape of E16.md Contrato (totals as non-negative integers, rows with lineNumber >= 1, status REVIEW or REJECTED only, reasons from the closed ImportReviewReason list plus MISSING_REQUIRED and ROW_FAILED for REJECTED)'
      - 'rejects an unknown reason, a negative total, a status OK in rows, an unknown extra field (strict) and a non-uuid personId or loanId'
      - 'personId and loanId are nullable (REJECTED rows have none)'
    budget: {attempts: 4, toolCalls: 20, minutes: 15}
    readFirst:
      - docs/plano/E16-F01/plano.md
      - packages/schemas/src/api/treasury/account-statement.test.ts
      - packages/schemas/src/api/api.test.ts
  - id: E16-T02
    title: Implement the import report schemas and the IMPORT_ALREADY_DONE error code
    kind: implement
    assignee: haiku
    rules: [RF-70]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-70, RFC-004 §3, RFC-004 §6, docs/plano/E16.md D3 D4 D8 D9, docs/plano/E16-F01/plano.md]
    dependsOn: [E16-T01]
    allowedPaths:
      - packages/schemas/src/api/imports/import-report.ts
      - packages/schemas/src/index.ts
      - packages/schemas/src/api/api.test.ts
      - docs/rfc/RFC-004-api-e-eventos.md
    protectedTests:
      - packages/schemas/src/api/imports/import-report.test.ts
    checks:
      - pnpm --filter @pilla/schemas exec vitest run src/api/imports
      - pnpm --filter @pilla/schemas typecheck
      - pnpm --filter @pilla/schemas lint
      - pnpm check:schemas
    done:
      - 'the protected tests pass'
      - 'importReviewReasonSchema is exported with the closed list of D4; IMPORT_ALREADY_DONE (409) is added to the RFC-004 §6 catalog and to the schema package error codes if one exists there'
      - 'no new dependency'
    budget: {attempts: 4, toolCalls: 25, minutes: 15}
    readFirst:
      - docs/plano/E16-F01/plano.md
      - packages/schemas/src/api/treasury/account-statement.ts
      - packages/schemas/src/index.ts
  - id: E16-T03
    title: Write the tests for the CSV parser, the column map and the row classification
    kind: test-author
    assignee: opus
    rules: [RF-70, RN-P01]
    skills: [escrever-teste]
    refs: [PRD-001 RF-70, PRD-001 RN-P01, RFC-002 §3, ADR-0004, ADR-0005, docs/plano/E16.md D3 D4 D5 D7, docs/plano/E16-F02/plano.md]
    dependsOn: [E16-T02]
    allowedPaths:
      - apps/api/src/imports/domain/parse-csv.test.ts
      - apps/api/src/imports/domain/classify-row.test.ts
      - apps/api/src/imports/domain/column-map.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/imports/domain'
      - node scripts/check-test-quality.mjs apps/api/src/imports/domain/parse-csv.test.ts apps/api/src/imports/domain/classify-row.test.ts apps/api/src/imports/domain/column-map.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'parser (A1 to A4): separator , or ; detected, BOM and CRLF tolerated, quoted fields with separators, empty file or missing required header fails with a typed error, more than 2000 rows fails'
      - 'column-map (A5, A6): money 1234,56 and 1234.56 to integer cents, 5 and 5,5 to bps, dates ISO and DD/MM/AAAA, unparseable value gives null not a throw, header names without accents in any order'
      - 'classifyRow OK (A7): INSTALLMENT, SINGLE_PAYMENT and INTEREST_ONLY rows whose rebuilt schedule matches valor_parcela to the cent are OK with type deduced from tipo or parcelas'
      - 'classifyRow REVIEW (A8, A9): one test per reason SCHEDULE_MISMATCH, TYPE_UNKNOWN, RATE_MISSING, INSTALLMENTS_MISSING, FIRST_DUE_MISSING, DATE_NOT_PARSEABLE, CPF_INVALID, PAID_EXCEEDS_TOTAL, PAID_DATE_MISSING; the plan is CUSTOM with installments summing to valor_parcela times parcelas (principal and interest split, total of each installment equal to valor_parcela) or a single principal installment when valor_parcela is absent'
      - 'classifyRow REJECTED (A10): missing nome, valor_emprestado <= 0 or unusable data_contrato gives REJECTED MISSING_REQUIRED and no plan'
      - 'CPF (A11): blank CPF is OK with personWithoutCpf true (RN-P01); invalid check digit gives CPF_INVALID and cpf null; valid CPF kept as 11 digits'
      - 'payment (A12): total_pago produces one consolidated payment plan with allocatePayment over the installments in order; paid equal to the total marks paidOff; paid above the total gives PAID_EXCEEDS_TOTAL and the allocatable amount only; all fixtures use packages/schemas fake-cpf, never real data'
    budget: {attempts: 4, toolCalls: 40, minutes: 30}
    readFirst:
      - docs/plano/E16-F02/plano.md
      - packages/finance/src/schedule.ts
      - packages/finance/src/allocation.ts
      - packages/finance/src/split.ts
      - packages/schemas/src/fake-cpf.ts
      - docs/rfc/RFC-002-motor-de-calculo-financeiro.md
  - id: E16-T04
    title: Implement the CSV parser, the column map and the row classification (pure domain)
    kind: implement
    assignee: sonnet
    rules: [RF-70, RN-P01]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-70, RFC-002, ADR-0002, docs/plano/E16.md D1 D3 D4 D5 D7, docs/plano/E16-F02/plano.md]
    dependsOn: [E16-T03]
    allowedPaths:
      - apps/api/src/imports/domain/**
    protectedTests:
      - apps/api/src/imports/domain/parse-csv.test.ts
      - apps/api/src/imports/domain/classify-row.test.ts
      - apps/api/src/imports/domain/column-map.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/imports/domain
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - 'the protected tests pass (A1 to A12)'
      - 'domain/ imports only @pilla/finance, @pilla/schemas and itself: no Nest, Drizzle, other module or Date.now (reference date is a parameter)'
      - 'column-map.ts is the only file that knows the spreadsheet header names'
      - 'all money is integer cents (ADR-0004), no float arithmetic'
    budget: {attempts: 4, toolCalls: 40, minutes: 30}
    readFirst:
      - docs/plano/E16-F02/plano.md
      - packages/finance/src/index.ts
      - packages/finance/src/schedule.ts
      - packages/finance/src/allocation.ts
  - id: E16-T05
    title: Write the tests for the imported person, imported loan and imported payment write ports
    kind: test-author
    assignee: opus
    rules: [RF-70, RN-P01, RN-C09]
    skills: [escrever-teste]
    refs: [PRD-001 RF-70, PRD-001 RN-P01, RFC-004 §7, RFC-005 §4, ADR-0002, ADR-0005, ADR-0006, docs/plano/E10.md D10, docs/plano/E16.md D5 D6 D7, docs/plano/E16-F03/plano.md]
    dependsOn: [E16-T02]
    allowedPaths:
      - apps/api/src/people/public/create-imported-person.test.ts
      - apps/api/src/lending/public/import-loan.test.ts
      - apps/api/src/payments/public/record-imported-payment.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/people/public/create-imported-person.test.ts src/lending/public/import-loan.test.ts src/payments/public/record-imported-payment.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/people/public/create-imported-person.test.ts apps/api/src/lending/public/import-loan.test.ts apps/api/src/payments/public/record-imported-payment.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'person port (A1 to A3): creates a person with cpf null (RN-P01) or with a valid CPF; an existing CPF returns the existing person id and reused true; runs in the caller transaction (rolls back with it)'
      - 'loan port (A4 to A8): inserts an ACTIVE loan with originType IMPORT, disbursedAt = contractedAt, base account, number from the contract year sequence, late terms copied from the current defaults, the given installments (CUSTOM, INSTALLMENT, SINGLE_PAYMENT or INTEREST_ONLY with the first installment only); writes loan.imported audit and a LoanActivated event with originType IMPORT; refuses a missing or inactive account'
      - 'payment port (A9 to A13): writes one CONFIRMED payment (channel ADMIN, method as given, isRecovery false) with allocations per installment and a PaymentConfirmed event; amount above the open total stores only the allocatable amount and returns excessCents; paid in full calls markLoanPaidOff (LoanPaidOff event, status PAID_OFF); amount zero writes nothing'
      - 'no port commits on its own and none touches another module tables directly (depcruise)'
      - 'events pass their schemas in packages/schemas/src/events'
    budget: {attempts: 4, toolCalls: 45, minutes: 35}
    readFirst:
      - docs/plano/E16-F03/plano.md
      - apps/api/src/lending/public/mark-loan-paid-off.ts
      - apps/api/src/lending/application/loans-service.ts
      - apps/api/src/lending/infra/loan-repository.ts
      - apps/api/src/payments/application/payments-service.ts
      - apps/api/src/people/application/people.service.ts
      - apps/api/src/db/test-db.ts
      - packages/schemas/src/events/loan-activated.ts
  - id: E16-T06
    title: Implement the imported person, imported loan and imported payment write ports
    kind: implement
    assignee: sonnet
    rules: [RF-70, RN-P01, RN-C09]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-70, RFC-001 M2, RFC-004 §7, ADR-0002, ADR-0006, docs/plano/E16.md D1 D5 D6 D7, docs/plano/E16-F03/plano.md]
    dependsOn: [E16-T05]
