delivery: E6
title: Loan simulation screen in the web app; Bia writes the tests, Alice the code
cards:
  - id: E6-T01
    title: Write the tests for frequencyOf and simulate
    kind: test-author
    assignee: bia
    rules: []
    refs: [PRD-001 RF-10, RFC-004 §5, RFC-002 §3.4, ADR-0013]
    dependsOn: []
    allowedPaths:
      - apps/web/lib/simulation.test.ts
    protectedTests: []
    checks:
      - node scripts/expect-red.mjs apps/web lib/simulation.test.ts
      - node scripts/check-test-quality.mjs apps/web/lib/simulation.test.ts
      - pnpm --filter @pilla/web typecheck
      - pnpm --filter @pilla/web lint
    done:
      - every test fails now against the stub in HEAD and would pass with a correct implementation (run_check 0)
      - 'import { frequencyOf, simulate } from "./simulation";'
      - frequencyOf gives unit DAY interval 7 for WEEKLY, DAY 15 for BIWEEKLY, MONTH 1 for MONTHLY and MONTH 2 for BIMONTHLY (RN-C04 of PRD-001)
      - the example of RFC-004 §5 with disbursementDate 2026-11-14 gives interest 190000n, total 690000n and installmentAmount 115000n (RFC-004 §5)
      - in that example the schedule has 6 lines and line 1 has dueDate 2026-12-14, principal 83333n, interest 31667n and total 115000n (RFC-004 §5)
      - CA-11 (principalCents 100000, 1000 bps, 4 installments, DAY 7) gives installmentAmount 27500n and total 110000n (PRD-001 CA-11)
      - simulate throws DueDateError of @pilla/finance when firstDueDate equals disbursementDate (RN-C04 of PRD-001)
      - never edit apps/web/lib/simulation.ts
    hints:
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
      - the RFC-004 §5 request is principalCents 500000, monthlyInterestRateBps 633, installmentCount 6, frequency MONTH 1, firstDueDate 2026-12-14, with type INSTALLMENT
      - dates passed as IsoDate come from isoDate of @pilla/finance
      - compare bigint values with toBe and the whole line 1 with toEqual against a plain object literal
    budget:
      attempts: 4
      toolCalls: 20
      minutes: 10
    readFirst:
      - apps/web/lib/simulation.ts
      - packages/schemas/src/api/lending/simulate-loan.ts
    sizeNote: um describe por função, 5 a 6 testes, ~60 linhas
  - id: E6-T02
    title: Implement frequencyOf and simulate and ignore apps/web/AGENTS.md
    kind: implement
    assignee: alice
    rules: []
    refs: [PRD-001 RF-10, RFC-002 §3.4, ADR-0013]
    dependsOn: [E6-T01]
    allowedPaths:
      - apps/web/lib/simulation.ts
      - .gitignore
    protectedTests:
      - apps/web/lib/simulation.test.ts
    checks:
      - pnpm --filter @pilla/web exec vitest run lib/simulation.test.ts --coverage --coverage.include=lib/simulation.ts --coverage.exclude=none --coverage.thresholds.lines=100 --coverage.thresholds.branches=100
      - node scripts/check-count.mjs .gitignore web/AGENTS.md 1
      - pnpm --filter @pilla/web typecheck
      - pnpm --filter @pilla/web lint
    done:
      - all tests in apps/web/lib/simulation.test.ts pass with 100% line and branch coverage of simulation.ts (run_check 0)
      - .gitignore ends with one new line that ignores the agents notes file of the web app, written as in the hint (run_check 1)
      - simulate calls generateSchedule with type INSTALLMENT, count equal to installmentCount and roundingStep 500n
      - numbers from the request become bigint with BigInt and get their brand with cents and bps of @pilla/finance, never with as
      - keep the types, the signatures and the /** */ comments unchanged
    hints:
      - frequencyOf is a switch over the four presets, as the /** */ comment of frequencyOf lists them
      - simulate builds the input of generateSchedule from the request fields and reads the summary from the lines it returns
      - one write_file of simulation.ts, then one edit_file of .gitignore that adds the last line apps/web/AGENTS.md, then run_check 0, 1, 2 and 3
    budget:
      attempts: 5
      toolCalls: 24
      minutes: 12
    readFirst:
      - apps/web/lib/simulation.ts
      - packages/finance/src/schedule.ts
      - packages/schemas/src/api/lending/simulate-loan.ts
    sizeNote: simulation.ts com ~50 linhas; .gitignore ganha 1 linha
  - id: E6-T03
    title: Write the tests for toSimulateRequest
    kind: test-author
    assignee: bia
    rules: []
    refs: [PRD-001 RF-10, RFC-004 §5, ADR-0013]
    dependsOn: [E6-T02]
    allowedPaths:
      - apps/web/lib/simulation-form.test.ts
    protectedTests: []
    checks:
      - node scripts/expect-red.mjs apps/web lib/simulation-form.test.ts
      - node scripts/check-test-quality.mjs apps/web/lib/simulation-form.test.ts
      - pnpm --filter @pilla/web typecheck
      - pnpm --filter @pilla/web lint
    done:
      - every test fails now against the stub in HEAD and would pass with a correct implementation (run_check 0)
      - 'import { toSimulateRequest } from "./simulation-form";'
      - amount "5.000,00", monthlyRate "6,33", installmentCount "6", MONTHLY, firstDueDate "2026-12-14" give the request of RFC-004 §5 with type INSTALLMENT (RFC-004 §5)
      - monthlyRate "10,00" gives monthlyInterestRateBps 1000 and WEEKLY gives frequency DAY 7 (PRD-001 CA-11)
      - amount "5000" without the comma throws MoneyError of @pilla/finance (parseReais format of RFC-004 §2)
      - installmentCount "0" throws ZodError of zod (simulateLoanRequest of ADR-0013)
      - never edit apps/web/lib/simulation-form.ts
    hints:
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
      - the RFC-004 §5 request is principalCents 500000, monthlyInterestRateBps 633, installmentCount 6, frequency MONTH 1, firstDueDate 2026-12-14
      - compare the whole request with toEqual against a plain object literal, and the error cases pass the error class to toThrow
    budget:
      attempts: 4
      toolCalls: 20
      minutes: 10
    readFirst:
      - apps/web/lib/simulation-form.ts
      - packages/schemas/src/api/lending/simulate-loan.ts
    sizeNote: um describe com 4 testes, ~45 linhas
