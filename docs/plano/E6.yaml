  - id: E6-T07
    title: Implement simulate
    kind: implement
    assignee: bia
    exception: nao-compensa-alice
    exceptionReason: "estourou 20 toolCalls 2x mesmo refatiado; decisão do Joel 17/11"
    exceptionApprovedBy: "Joel 2026-11-17"
    rules: [RN-C03, RN-C04]
    skills:
      - editar-arquivo
      - coding-guidelines
    refs: [PRD-001 RF-10, RFC-002 §3.4, RFC-004 §5, PRD-001 CA-11, ADR-0013]
    dependsOn: [E6-T02]
    allowedPaths:
      - apps/web/lib/simulation.ts
    protectedTests:
      - apps/web/lib/simulation.test.ts
    checks:
      - pnpm --filter @pilla/web exec vitest run lib/simulation.test.ts -t simulate
      - pnpm --filter @pilla/web typecheck
      - pnpm --filter @pilla/web lint
    done:
      - the four tests of the describe simulate in apps/web/lib/simulation.test.ts pass (run_check 0)
      - 'import { bps, cents, generateSchedule, isoDate } from "@pilla/finance";'
      - simulate calls generateSchedule with type INSTALLMENT, count equal to installmentCount, the request frequency, disbursementDate and roundingStep 500n (RN-C03)
      - principalCents and monthlyInterestRateBps become Cents and Bps through BigInt and then cents and bps, never with as
      - firstDueDate is plain text in the request and becomes IsoDate through isoDate before it reaches generateSchedule
      - interest, total and installmentAmount are Cents made with cents, and schedule is the array generateSchedule gives
      - simulate has no if, no ternary, no ?? and no ?. and no try and no catch, so an error of generateSchedule such as DueDateError of RN-C04 goes up untouched
      - simulation.ts keeps the line '// @stub E6-T02', frequencyOf, the import type lines, the types and the /** */ comments
      - the parameters of simulate lose the underscore, and the import line of the done is the only new line outside simulate
    hints:
      - the only file read is apps/web/lib/simulation.ts, because every type and signature needed is in these hints
      - the signature stays as in HEAD, with parameter request of type SimulateLoanRequest, parameter disbursementDate of type IsoDate and result type SimulationResult
      - the import line of the done goes right after the line '// @stub E6-T02', above the two import type lines that stay as they are
      - cents takes a bigint and gives Cents, bps takes a bigint and gives Bps, and isoDate takes a string and gives IsoDate, all from @pilla/finance
      - generateSchedule takes one object with type, count, principal, monthlyInterestRate, firstDueDate, frequency, disbursementDate and roundingStep and gives ScheduledInstallment[]
      - each ScheduledInstallment has number, dueDate, principal, interest and total, the last three of type Cents
      - SimulateLoanRequest of @pilla/schemas has type, principalCents, monthlyInterestRateBps, installmentCount, frequency and firstDueDate, with plain number and string
      - request.frequency already has the shape of Frequency, so it goes to generateSchedule as it is
      - interest and total are sums over the lines, and adding two Cents gives a plain bigint, so each sum goes through cents before it enters the result
      - never read a line by index or by destructuring, since the strict tsconfig makes it possibly undefined and its guard would be a branch no test reaches
      - RN-C03 says every installment has the same total, so installmentAmount comes from total and the number of lines, both bigint
      - write only apps/web/lib/simulation.ts, since apps/web/lib/simulation.test.ts is protected and no other file changes
      - one edit_file of simulation.ts that adds the import line, one replace_function of simulate, then run_check 0, 1 and 2
    budget:
      attempts: 4
      toolCalls: 18
      minutes: 10
    readFirst:
      - apps/web/lib/simulation.ts
    sizeNote: simulate com ~20 linhas e 1 linha de import nova; o resto de simulation.ts não muda
