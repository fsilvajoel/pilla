  - id: E6-T05
    title: Write the tests for the LoanSimulation component
    kind: test-author
    assignee: bia
    rules: []
    refs: [PRD-001 RF-10, RFC-004 §5, ADR-0013]
    dependsOn: [E6-T04]
    allowedPaths:
