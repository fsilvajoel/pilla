    done:
      - every test fails now against the stub in HEAD and would pass with a correct implementation (run_check 0)
      - 'import { LoanSimulation } from "./loan-simulation";'
      - shows inputs labelled "Valor emprestado", "Taxa ao mês (%)", "Nº de parcelas", "Periodicidade", "1º vencimento" and a button "Simular" (PRD-001 RF-10)
      - the RFC-004 §5 example with disbursementDate 2026-11-14 and a click on Simular shows "R$ 6.900,00", "R$ 1.900,00" and "6 × R$ 1.150,00" (RFC-004 §5)
      - in that result a table row has "14/12/2026", "833,33", "316,67" and "1.150,00" (RFC-004 §5)
      - amount 5000 without the comma and a click on Simular shows an element with role alert
      - never edit apps/web/components/loan-simulation.tsx
    hints:
      - follow apps/web/app/page.test.tsx, fill fields with fireEvent.change on getByLabelText and wait for the result with findByText, because the submit is async
      - Periodicidade is a select whose option values are the presets, so the example uses MONTHLY
      - the RFC-004 §5 example typed in the form is amount 5.000,00, rate 6,33, 6 installments and first due date 2026-12-14
      - one write_file of the whole test file, then run_check 0, 1, 2 and 3
