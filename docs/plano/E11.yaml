      - '! pnpm --filter @pilla/schemas exec vitest run src/api/payments/create-payment.test.ts src/api/payments/payment-views.test.ts src/api/payments/pending-payments.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/payments/http/payments-create.http.test.ts apps/api/src/payments/http/payments-list.http.test.ts apps/api/src/payments/public/pending-payments.test.ts packages/schemas/src/api/payments/create-payment.test.ts packages/schemas/src/api/payments/payment-views.test.ts packages/schemas/src/api/payments/pending-payments.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'register (A1 to A5, C1 to C6): 201 with status PENDING_REVIEW, version 1, personId copied from the loan, channel ADMIN and an audit row; no allocation, no outbox row, no effect on the loan balance (RN-R01)'
      - 'DRAFT (A6, C7): a payment on a DRAFT loan is accepted as PENDING_REVIEW and allocates nothing (decision of 20/11)'
      - 'recovery (A7, C8): a payment on a WRITTEN_OFF loan is accepted (RN-C20)'
      - 'refusals (A8 to A13, C9 to C16): unknown loan 404; inactive or unknown accountId 422 on accountId; amount above the balance 422 PAYMENT_EXCEEDS_BALANCE on ACTIVE; PAID_OFF, RENEWED, RENEGOTIATED, CANCELLED 422 LOAN_CLOSED_FOR_PAYMENTS with successorLoanId; paidAt before disbursedAt or in the future 422 on paidAt; unknown keys, destinationKey and receiptAttachmentId 400 VALIDATION_FAILED; nothing is written on a refusal'
      - 'idempotency (A14, C17, C18): the same Idempotency-Key returns the same payment and creates one row; no key creates a new payment each time'
      - 'list (A15, A16, C19 to C22): GET /payments filters by status and loanId, orders pending oldest first inside PENDING_REVIEW, paginates by cursor without repeating items and carries loanNumber and personName'
      - 'public port (A17 to A19, C23 to C27): listPendingReviewPayments returns only PENDING_REVIEW rows, oldest first, with count and totalCents of all pending rows (not only the page), honours limit (default 50, max 200) and returns plain objects (no Drizzle row)'
      - 'schemas (A20, C28 to C31): createPaymentRequest is {loanId, accountId, paidAt, amountCents, method} and strict; pendingPaymentSchema and pendingPaymentsSummarySchema match the contract in docs/plano/E11-F02/plano.md'
    budget: {attempts: 4, toolCalls: 30, minutes: 20}
