      - pnpm --filter @pilla/api typecheck
    done:
      - 'reverse (A1 to A6, C1 to C7): a CONFIRMED payment becomes REVERSED with reversedAt, reversedBy, reversalReason and version + 1; every allocation of it gets reversed_at; the installments and outstandingCents on GET /loans/{id} go back as if it never happened; the rows are kept (RN-R07); an audit row is written'
      - 'events (A7, C8, C9): one PaymentReversed in the outbox that validates against paymentReversedV1 with the same allocations and the reason; nothing is published when the reversal is refused'
      - 'reopen (A8 to A10, C10 to C12): reversing a payment of a PAID_OFF loan that leaves a balance sets the loan back to ACTIVE with status_changed_at, an audit row and a LoanReopened (reason = the reversal reason); on an ACTIVE or WRITTEN_OFF loan the status does not change'
      - 'blocked (A11, A12, C13, C14): RENEWED and RENEGOTIATED loans 422 REVERSAL_BLOCKED_BY_SUCCESSOR (RN-R11); nothing is written'
      - 'refusals (A13 to A17, C15 to C20): PENDING_REVIEW or REVERSED payment 409 PAYMENT_NOT_CONFIRMED; wrong If-Match 409 VERSION_CONFLICT; missing or blank reason 400 VALIDATION_FAILED; unknown payment 404'
      - 'schema (A18, C21, C22): reversePaymentRequest requires a reason and rejects unknown keys'
