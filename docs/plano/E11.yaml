  - id: E11-T08
    title: Implement payment reversal (PaymentReversed, reopen a PAID_OFF loan)
    kind: implement
    assignee: baidu
    rules: [RN-R07, RN-R10, RN-R11]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-22, RFC-004 §3, RFC-004 §7, ADR-0006, docs/plano/E11.md D3 D4 D10 D12, docs/plano/E11-F04/plano.md]
    dependsOn: [E11-T07]
    allowedPaths:
      - apps/api/src/payments/application/**
      - apps/api/src/payments/http/**
      - apps/api/src/payments/infra/**
      - apps/api/src/lending/public/**
      - apps/api/src/lending/infra/loan-repository.ts
    protectedTests:
      - apps/api/src/payments/http/payments-reverse.http.test.ts
      - packages/schemas/src/api/payments/reverse-payment.test.ts
      - apps/api/src/payments/http/payments-confirm.http.test.ts
      - apps/api/src/payments/http/payments-create.http.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/payments src/lending
      - pnpm --filter @pilla/schemas exec vitest run src/api/payments
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A18) and the F01 to F03 tests still pass
      - reversal runs in one transaction that locks the payment and the loan; allocations are marked reversed, never deleted
      - the block and the reopening use isReversalBlocked and reopensOnReversal of lending/domain/reversal.ts through lending/public (reopenLoan(tx, ...)); payments never updates a lending table
      - the loan balance used for the reopening is the open principal plus interest after the reversal, not a stored value (ADR-0005)
