      - 'distribution (A1 to A4, C1 to C6): the oldest installment first and charges, then interest, then principal inside each; a payment beyond one installment spills to the next; a partial payment leaves the installment PARTIAL; the amounts sum to amountCents'
      - 'balance (A5, A6, C7, C8): outstandingBeforeCents and outstandingAfterCents match @pilla/finance at paidAt; paysOff is true only when the payment clears the balance'
      - 'refusals (A7 to A11, C9 to C14): amount above the balance 422 PAYMENT_EXCEEDS_BALANCE; PAID_OFF, RENEWED, RENEGOTIATED and CANCELLED 422 LOAN_CLOSED_FOR_PAYMENTS (successorLoanId when there is one); paidAt before disbursedAt or after today 422 VALIDATION_FAILED on paidAt; unknown loan 404; nothing is written in any case'
