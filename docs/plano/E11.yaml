  - id: E11-T12
    title: Write the tests for late charges after a partial payment in @pilla/finance
    kind: test-author
    assignee: bia
    rules: [RN-E01, RN-E02, RN-R04]
    skills: [escrever-teste]
    refs: [RFC-002 §3.5, RFC-002 §3.6, RFC-002 §3.7, ADR-0004, docs/plano/E11.md D11, docs/plano/E11-F07/plano.md]
    dependsOn: [E10-T10]
    allowedPaths:
      - packages/finance/src/partial-charges.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/finance exec vitest run src/partial-charges.test.ts'
      - node scripts/check-test-quality.mjs packages/finance/src/partial-charges.test.ts
      - pnpm --filter @pilla/finance typecheck
    done:
      - 'no history (A1, C1): an installment without payment history gives exactly the charges of lateChargesAt today (every existing case keeps its value)'
      - 'fine once (A2, A3, C2 to C4): after a partial payment that covered the fine, the fine is not charged again; the late interest runs on the new open amount from the payment date'
      - 'carry (A4, C5, C6): a payment smaller than the charges leaves the unpaid charges owed and they are not charged twice'
      - 'order (A5, C7): several payments are folded by paidAt order, not by insertion order'
      - 'allocation (A6, A7, C8 to C10): allocatePayment on an installment with history pays charges, then interest, then principal; the sum still equals the amount; PAYMENT_EXCEEDS_BALANCE uses the history-aware balance'
      - 'property (A8, C11, prop): paying the whole outstandingBalance at ref leaves outstandingBalance 0 at ref, with or without history'
    budget: {attempts: 4, toolCalls: 25, minutes: 15}
    readFirst:
      - docs/plano/E11-F07/plano.md
      - packages/finance/src/allocation.ts
      - packages/finance/src/balance.ts
      - packages/finance/src/late-charges.ts
      - packages/finance/src/properties.test.ts
