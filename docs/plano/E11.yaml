    allowedPaths:
      - apps/api/src/payments/http/allocation-preview.http.test.ts
      - packages/schemas/src/api/payments/allocation-preview.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/payments/http/allocation-preview.http.test.ts'
      - '! pnpm --filter @pilla/schemas exec vitest run src/api/payments/allocation-preview.test.ts'
