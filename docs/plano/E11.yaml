      - packages/schemas/src/api/payments/reverse-payment.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/payments/http/payments-reverse.http.test.ts'
      - '! pnpm --filter @pilla/schemas exec vitest run src/api/payments/reverse-payment.test.ts'
