  # ---------------------------------------------------------------- E11-F03: confirmar
  - id: E11-T05
    title: Write the tests for POST /payments/{id}/confirm (allocations, events, PAID_OFF)
    kind: test-author
    assignee: claude
    rules: [RN-R01, RN-R02, RN-R03, RN-R04, RN-R09, RN-C09, RN-C20, RN-T03]
    skills: [escrever-teste]
    refs: [PRD-001 RF-21, RFC-002 §3.6, RFC-004 §3, RFC-004 §6, RFC-004 §7, ADR-0006, docs/plano/E10.md D3, docs/plano/E11.md D4 D5 D6 D7 D8 D9 D10, docs/plano/E11-F03/plano.md]
    dependsOn: [E11-T04, E11-T15]
    allowedPaths:
      - apps/api/src/payments/http/payments-confirm.http.test.ts
      - apps/api/src/payments/application/confirm-concurrency.test.ts
    protectedTests: []
    checks:
      - '! pnpm --filter @pilla/api exec vitest run src/payments/http/payments-confirm.http.test.ts src/payments/application/confirm-concurrency.test.ts'
      - node scripts/check-test-quality.mjs apps/api/src/payments/http/payments-confirm.http.test.ts apps/api/src/payments/application/confirm-concurrency.test.ts
      - pnpm --filter @pilla/api typecheck
    done:
      - 'allocation (A1 to A5, C1 to C7): confirming writes one payment_allocations row per touched installment with the F01 distribution; the payment becomes CONFIRMED with confirmedAt, confirmedBy and version + 1; GET /loans/{id} then shows the installment paidCents and the lower outstandingCents (RN-R01)'
      - 'events (A6 to A8, C8 to C11): one PaymentConfirmed in core.outbox that validates against paymentConfirmedV1 and whose allocations sum to amountCents; one InstallmentPaid per installment that became PAID, with daysLate; an audit row; all in the same transaction'
      - 'PAID_OFF (A9 to A11, C12 to C14): when the balance reaches zero an ACTIVE loan becomes PAID_OFF with status_changed_at, an audit row and a LoanPaidOff in the outbox (paidOffAt = paidAt); a partial payment keeps ACTIVE; a payment equal to the payoff quote pays the loan off'
      - 'DRAFT (A12, A13, C15, C16): confirming a payment of a DRAFT loan is refused with 409 LOAN_NOT_ACTIVE and the payment stays PENDING_REVIEW; after the loan is activated the same payment confirms and allocates then'
      - 'recovery (A14, C17): confirming on a WRITTEN_OFF loan sets isRecovery true, allocates, and the loan stays WRITTEN_OFF with no LoanPaidOff'
      - 'refusals (A15 to A20, C18 to C24): not PENDING_REVIEW 409 PAYMENT_NOT_PENDING; wrong If-Match 409 VERSION_CONFLICT; amount above the balance now (other payment confirmed first) 422 PAYMENT_EXCEEDS_BALANCE; loan closed meanwhile 422 LOAN_CLOSED_FOR_PAYMENTS; paidAt before disbursedAt 422; nothing is written and the payment stays PENDING_REVIEW'
      - 'concurrency (A21, C25): two simultaneous confirmations of two pending payments that together exceed the balance: one succeeds, the other gets 422 and the installments are never over-allocated'
    budget: {attempts: 4, toolCalls: 35, minutes: 25}
    readFirst:
      - docs/plano/E11-F03/plano.md
      - docs/plano/E11-F02/plano.md
      - packages/schemas/src/events/payment-confirmed.ts
      - packages/schemas/src/events/installment-paid.ts
      - packages/schemas/src/events/loan-paid-off.ts
      - apps/api/src/payments/http/payments-create.http.test.ts
      - apps/api/src/lending/http/loans-activate.http.test.ts
      - apps/api/src/core/infra/outbox-writer.ts
  - id: E11-T06
    title: Implement payment confirmation (allocations, events, PAID_OFF)
    kind: implement
    assignee: claude
    rules: [RN-R01, RN-R02, RN-R03, RN-R04, RN-R09, RN-C09, RN-C20, RN-T03]
    skills: [editar-arquivo, coding-guidelines, modular-design-principles]
    refs: [PRD-001 RF-21, RFC-004 §3, RFC-004 §7, ADR-0006, docs/plano/E10.md D3 D7, docs/plano/E11.md D3 D4 D5 D10, docs/plano/E11-F03/plano.md]
    dependsOn: [E11-T05]
    allowedPaths:
      - apps/api/src/payments/application/**
      - apps/api/src/payments/http/**
      - apps/api/src/payments/infra/**
      - apps/api/src/lending/public/**
      - apps/api/src/lending/infra/payment-loan-reader.ts
      - apps/api/src/lending/infra/loan-repository.ts
    protectedTests:
      - apps/api/src/payments/http/payments-confirm.http.test.ts
      - apps/api/src/payments/application/confirm-concurrency.test.ts
      - apps/api/src/payments/http/payments-create.http.test.ts
      - apps/api/src/payments/http/allocation-preview.http.test.ts
      - apps/api/src/payments/public/pending-payments.test.ts
      - apps/api/src/lending/http/loans-read.http.test.ts
    checks:
      - pnpm --filter @pilla/api exec vitest run src/payments src/lending
      - pnpm --filter @pilla/api typecheck
      - pnpm --filter @pilla/api lint
      - pnpm depcruise
    done:
      - the protected tests pass (A1 to A21) and the F01 and F02 tests still pass
      - confirmation runs in one transaction that locks the payment and the loan row (FOR UPDATE) and writes payment, allocations, loan status, audit and outbox together
      - the PAID_OFF transition is lending/public markLoanPaidOff(tx, ...), which writes status, status_changed_at, audit and LoanPaidOff; payments never updates a lending table
      - the public ports listPendingReviewPayments and confirmedAllocationsByLoan keep their signatures
      - no computed value is stored (ADR-0005): outstanding and standing stay derived
    hints:
      - the distribution is the F01 use case with ref = paidAt; do not duplicate it
      - map installmentNumber to installmentId through the loan read of lending/public
      - only newly PAID installments get an InstallmentPaid
    budget: {attempts: 3, toolCalls: 50, minutes: 40}
    readFirst:
      - docs/plano/E11-F03/plano.md
      - apps/api/src/payments/application
      - apps/api/src/lending/public
      - apps/api/src/lending/domain/loan-transitions.ts
      - apps/api/src/core/public/audit.ts
      - apps/api/src/core/infra/outbox-writer.ts
      - apps/api/src/lending/application/loans-service.ts
