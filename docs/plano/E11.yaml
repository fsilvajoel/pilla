    skills: [escrever-teste]
    refs: [PRD-001 RF-23, RFC-002 §3.6, RFC-004 §3, RFC-004 §6, ADR-0005, docs/plano/E11.md D2 D3 D5 D6 D7, docs/plano/E11-F01/plano.md]
