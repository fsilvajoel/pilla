# CI obrigatório (docs/agents/travas.md §8): install, dependências permitidas, env, lint, typecheck, fronteiras, testes+cobertura, audit, gitleaks.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 -m pip install --quiet pyyaml
      - run: pnpm verify
      - run: pnpm mutation
      - run: pnpm audit --audit-level high
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact .
      - name: tamanho do PR (aviso acima de 400 linhas)
        if: github.event_name == 'pull_request'
        run: |
          n=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" -- . ':!pnpm-lock.yaml' ':!**/*.png' | awk '{s+=$1+$2} END {print s+0}')
          echo "linhas alteradas: $n"
          if [ "$n" -gt 400 ]; then echo "::warning::PR com $n linhas alteradas (> 400). Considere dividir."; fi
