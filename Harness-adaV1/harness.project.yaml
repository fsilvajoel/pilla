name: Harness-adaV1
entrypoint: python3 script/ada.py --project .
project_root: .
output_dir: .harness/runs
agent_dir: agent
skill_dir: skill
capability_dir: capability
policy_dir: policy
tool_dir: tools
workflow_dir: workflow
gate_dir: gate
script_dir: script
rules_path: null
default_model_profile: default

# Idioma (policy/idioma.md): texto do harness em pt-BR; código e commits em inglês.
language:
  docs: pt-BR
  code: en
  commits: en

# Papel (agent/*.md) -> quem executa e com qual perfil de modelo.
# Só este arquivo liga papel a nome e modelo; agent/ fica neutro.
roles:
  developer: {name: developer, model_profile: local}
  reviewer: {name: reviewer, model_profile: remote-reviewer}
  coordinator: {name: coordinator, model_profile: lead}
  platform: {name: platform, model_profile: lead}
  planner: {name: planner, model_profile: lead}

# Comandos de verificação do projeto alvo. Cartões, skills e gates citam a
# chave (commands.test etc.), nunca o comando literal.
commands:
  test: pnpm --filter <pkg> exec vitest run <arquivo>
  coverage: pnpm --filter <pkg> test
  typecheck: pnpm --filter <pkg> typecheck
  lint: pnpm --filter <pkg> lint
  format: pnpm exec prettier --check <arquivos>
  deps: pnpm depcruise
  tests-qual: pnpm check:tests
  schemas: pnpm check:schemas
  db: pnpm --filter @pilla/api db:generate
  mutation: pnpm --filter @pilla/finance mutation
  verify: pnpm verify

# Gate portable: textos que não podem aparecer fora deste arquivo.
portable:
  forbidden:
    - pilla
    - /home/
    - tools/alice-harness
    - docs/regras
    - /apps/

# Pesquisa externa (policy/research.md): domínios permitidos; vazio = só fonte oficial.
research:
  domains: []

checks:
  - portable
  - skill-format
  - tool-contract
  - redact
  - edit-guard
  - ssh-gate
