# Hooks locais (docs/agents/travas.md §8): pre-commit = format + lint + gitleaks; pre-push = typecheck + testes.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,mjs,cjs,json}"
      exclude: ["pnpm-lock.yaml", "tools/**", "docs/**"]
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint {staged_files}
    gitleaks:
      run: gitleaks git --pre-commit --staged --no-banner
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    verify:
      run: pnpm verify
